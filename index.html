    const ValidationUtils = {
      cleanChileanRut(rawRut) {
        if (!rawRut) return '';
        return rawRut.toString().toUpperCase().replace(/\./g, '').replace(/-/g, '').replace(/\s+/g, '').trim();
      },

      isValidChileanRut(rawRut) {
        const clean = this.cleanChileanRut(rawRut);
        if (clean.length < 8 || clean.length > 9) return false;

        const body = clean.slice(0, -1);
        const dv = clean.slice(-1);

        if (!/^\d+$/.test(body)) return false;
        if (!/^[\dK]$/.test(dv)) return false;

        let sum = 0;
        let multiplier = 2;
        for (let i = body.length - 1; i >= 0; i--) {
          sum += parseInt(body[i], 10) * multiplier;
          multiplier = multiplier >= 7 ? 2 : multiplier + 1;
        }

        const remainder = sum % 11;
        const calculatedDvValue = 11 - remainder;

        let expectedDv = '0';
        if (calculatedDvValue === 11) expectedDv = '0';
        else if (calculatedDvValue === 10) expectedDv = 'K';
        else expectedDv = calculatedDvValue.toString();

        return dv === expectedDv;
      },

      formatChileanRut(rawRut) {
        const clean = this.cleanChileanRut(rawRut);
        if (clean.length < 2) return clean;
        const body = clean.slice(0, -1);
        const dv = clean.slice(-1);
        const formattedBody = new Intl.NumberFormat('es-CL').format(parseInt(body, 10));
        return `${formattedBody}-${dv}`;
      },

      isValidEmail(email) {
        if (!email) return false;
        const clean = email.trim();
        return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(clean);
      },

      validatePasswordRequirements(password) {
        const errors = [];
        if (!password || password.length < 6) errors.push('Mínimo 6 caracteres');
        if (!/[A-Za-z]/.test(password || '')) errors.push('Al menos una letra');
        if (!/\d/.test(password || '')) errors.push('Al menos un número');
        return errors;
      },

      async hashPassword(password) {
        try {
          const cleanPass = (password || '').trim();
          const encoder = new TextEncoder();
          const data = encoder.encode(cleanPass);
          const hashBuffer = await crypto.subtle.digest('SHA-256', data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
          return btoa(password || '');
        }
      }

        const year = now.getFullYear();

        const minutes = String(now.getMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      },

      currentDateTimeString() {
        return `${this.currentDateString()} ${this.currentTimeString()}`;
      },

      normalizeDateToYMD(dateStr) {
        if (!dateStr) return '';
        const trimmed = dateStr.trim().split(' ')[0];
        if (/^\d{2}-\d{2}-\d{4}$/.test(trimmed)) {
          const [d, m, y] = trimmed.split('-');
          return `${y}-${m}-${d}`;
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
          return trimmed;
        }
        return trimmed;

      normalizeDateTimeString(dateTimeStr) {
        if (!dateTimeStr) return '';
        const parts = dateTimeStr.trim().split(' ');
        const datePart = parts[0];
        const timePart = parts.length > 1 ? parts[1] : '';
        const ymd = this.normalizeDateToYMD(datePart);
        return timePart ? `${ymd} ${timePart}` : ymd;

        if (!dateStr) return '';
        try {
          let day, month, year;
          const clean = dateStr.trim().split(' ')[0];
          const parts = clean.split('-');
          if (parts.length === 3) {
            if (parts[0].length === 4) {
              // YYYY-MM-DD
              year = parseInt(parts[0], 10);
              month = parseInt(parts[1], 10) - 1;
              day = parseInt(parts[2], 10);
            } else {
              // DD-MM-YYYY
              day = parseInt(parts[0], 10);
              month = parseInt(parts[1], 10) - 1;
              year = parseInt(parts[2], 10);
            }
            const d = new Date(year, month, day);
            const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

              'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
              'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            return `${dias[d.getDay()]}, ${day} de ${meses[month]} de ${year}`;
          }
        } catch (e) {
          console.error(e);
        }
        return dateStr;
      }

      // Sucursales y barberos desde las tablas sucursal y barbero
      async refreshCatalogFromCloud() {
        const sb = this.getCloudClient();
        if (!sb) return;
        try {
          const [{ data: sucursales }, { data: barberos }] = await Promise.all([
            sb.rpc('api_sucursales'),
            sb.rpc('api_barberos')
          ]);
          if (Array.isArray(sucursales) && sucursales.length) {
            const current = this.getLocations();
            const locations = sucursales.map(s => {
              const prev = current.find(l => l.id === s.id) || SEED_LOCATIONS.find(l => l.id === s.id) || {};
              return { ...prev, id: s.id, name: s.name, address: s.address, phone: s.phone || '', lat: Number(s.lat) || prev.lat, lng: Number(s.lng) || prev.lng, isPrimary: Boolean(s.is_primary) };
            });
            localStorage.setItem('bigboys_locations', JSON.stringify(locations));
          }
          if (Array.isArray(barberos) && barberos.length) {
            const barbers = barberos.map(b => ({
              id: b.id,
              locationId: b.location_id,
              name: b.name,
              specialty: b.specialty || '',
              rating: Number(b.rating) || 5,
              avatarUrl: b.avatar_url || '',
              availableHours: b.available_hours || '',
              bio: b.bio || '',
              active: Boolean(b.active)
            }));
            localStorage.setItem('bigboys_barbers', JSON.stringify(barbers));
          }
          this.notify();
        } catch (err) {
          console.warn('Aviso al cargar sucursales y barberos desde Supabase:', err);
        }
      }

      async refreshAppointmentsFromCloud() {
        const sb = this.getCloudClient();
        if (!sb) return;
        try {
          const { data, error } = await sb.rpc('api_listar_reservas', { p_formato: 'WEB', ...this.getCloudCredentials() });
          if (!error && Array.isArray(data)) {
            this.syncAppointmentsFromCloud(data.map(d => this.mapCloudAppointment(d)));
          }
        } catch (err) {
          console.warn('Aviso al consultar reservas en Supabase:', err);
        }
      }

      initCloudSync() {
        if (!this.getCloudClient()) {
          console.log('ℹ️ Supabase no está conectado todavía. Modo local activo.');
          return;
        }
        this.cloudSyncActive = true;
        this.refreshCatalogFromCloud();
        this.refreshAppointmentsFromCloud();
        // Las tablas están cerradas (RLS): en vez de Realtime se consultan las reservas cada 8 segundos
        if (this.unsubscribeCloud) this.unsubscribeCloud();
        const timer = setInterval(() => this.refreshAppointmentsFromCloud(), 8000);
        this.unsubscribeCloud = () => clearInterval(timer);
      }

      syncAppointmentsFromCloud(cloudList) {
        if (!Array.isArray(cloudList)) return;

        const localList = this.getAppointments();
        const mergedMap = new Map();

        // 1. Cargar las citas locales
        localList.forEach((a) => {
          mergedMap.set(String(a.id), a);
        });

        // 2. Sobrescribir / añadir con Supabase PostgreSQL (máxima prioridad y sincronización viva)
        cloudList.forEach((ca) => {
          mergedMap.set(String(ca.id), ca);
        });

        const mergedList = Array.from(mergedMap.values());
        mergedList.sort((a, b) => {
          const timeA = Number(a.id) || 0;
          const timeB = Number(b.id) || 0;
          return timeB - timeA;
        });

        localStorage.setItem('bigboys_appointments', JSON.stringify(mergedList));
        this.notify();
      }

      async publishAppointmentToCloud(appointment) {
        const sb = this.getCloudClient();
        if (!sb) return false;
        try {
          // Una atención presencial sin abono se registra con canal LOCAL
          const isWalkIn = Number(appointment.prepayAmount) === 0 && appointment.status === 'Completada';
          const { data, error } = await sb.rpc('api_crear_reserva', {
            p: {
              id: Number(appointment.id) || Date.now(),
              canal: isWalkIn ? 'LOCAL' : 'WEB',
              barber_id: Number(appointment.barberId) || 1,
              location_id: Number(appointment.locationId) || 1,
              service_name: appointment.serviceName || 'Corte',
              date_time: appointment.dateTime || '',
              status: appointment.status || 'Confirmada',
              customer_name: appointment.customerName || '',
              customer_phone: appointment.customerPhone || '',
              customer_email: appointment.customerEmail || ''
            }
          });
          if (error) {
            console.warn('Aviso publicando en Supabase:', error.message);
            return false;
          }
          console.log('✓ Reserva guardada en Supabase (tabla reserva):', data && data.codigo);
          return true;
        } catch (e) {
          console.warn('Error publicando en Supabase:', e);
          return false;
        }
      }

      async sendRealEmail({ to, subject, body }) {
        if (!to) return false;
        const cleanTo = to.trim().toLowerCase();

        // 1. Despacho Nube 24/7 (Google Apps Script Web App / Webhook en la Nube sin tarjetas)
        const cloudUrl = (localStorage.getItem('bigboys_cloud_mailer_url') || '').trim();
        if (cloudUrl) {
          try {
            await fetch(cloudUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ to: cleanTo, subject, body })
            });
            console.log('✓ Correo despachado exitosamente vía Google Cloud Webhook 24/7:', cleanTo);
            return true;
          } catch (cloudSendErr) {
            console.warn('Aviso en despacho vía Google Cloud Webhook, probando respaldo:', cloudSendErr);
          }
        }

        // 2. Intento de despacho directo vía servicio HTTP local (localhost:3001)
        try {
          const res = await fetch('http://localhost:3001/api/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ to: cleanTo, subject, body })
          });
          if (res.ok) {
            console.log('✓ Correo despachado en vivo vía Servicio Local Gmail SMTP:', cleanTo);
            return true;
          }
        } catch (localErr) {
          // Si el servidor local no está activo en esta sesión, continuar a la cola de Supabase
        }

        // 3. La confirmación y la cancelación quedan registradas en la tabla notificacion
        //    (las crean api_crear_reserva y api_actualizar_reserva)
        return false;
      }

      saveEmailToDatabase(email, fullName = '', phone = '', source = 'Registro Online', notes = '') {
        if (!email || !email.includes('@')) return;
        const cleanEmail = email.trim().toLowerCase();
        const db = this.getEmailDatabase();
        const existing = db.find(item => item.email.toLowerCase() === cleanEmail);

        if (existing) {
          if (fullName && (!existing.fullName || existing.fullName === 'Cliente Big Boys')) existing.fullName = fullName.trim();
          if (phone && !existing.phone) existing.phone = phone.trim();
          existing.lastActivityAt = AppFormatters.currentDateTimeString();

      async login(email, password) {
        const cleanEmail = (email || '').trim().toLowerCase();
        const cleanPass = (password || '').trim();
        if (!cleanEmail) return { success: false, message: 'Por favor ingresa tu correo electrónico.' };
        if (!cleanPass) return { success: false, message: 'Por favor ingresa tu contraseña.' };

        let users = this.getUsers();
        let user = users.find(u => u.email.toLowerCase() === cleanEmail);

        const expectedHash = await ValidationUtils.hashPassword(cleanPass);

        // --- VERIFICACIÓN EN SUPABASE (api_login): la contraseña se valida en la base de datos ---
        const sb = this.getCloudClient();
        if (sb) {
          try {
            const { data: cloudUser, error } = await sb.rpc('api_login', { p_email: cleanEmail, p_password_sha256: expectedHash });
            if (!error && cloudUser) {
              const merged = {
                ...(user || {}),
                id: cloudUser.id,
                fullName: cloudUser.full_name || cleanEmail.split('@')[0],
                email: cleanEmail,
                phone: cloudUser.phone || (user && user.phone) || '',
                passwordHash: expectedHash,
                role: cloudUser.role,
                createdAt: (user && user.createdAt) || AppFormatters.currentDateTimeString()
              };
              users = users.filter(u => u.email.toLowerCase() !== cleanEmail);
              users.push(merged);
              localStorage.setItem('bigboys_users', JSON.stringify(users));
              user = merged;
            } else if (!error) {
              const { data: exists } = await sb.rpc('api_usuario_existe', { p_email: cleanEmail });
              if (!exists) {
                if (user) {
                  users = users.filter(u => u.email.toLowerCase() !== cleanEmail);
                  localStorage.setItem('bigboys_users', JSON.stringify(users));
                }
                return { success: false, message: `El correo '${cleanEmail}' no se encuentra registrado en Big Boys.` };
              }
              return { success: false, message: 'Contraseña incorrecta. Por favor verifica e intenta nuevamente.' };
            }
          } catch (sbLoginErr) {
            console.warn('Aviso al validar usuario en Supabase:', sbLoginErr);
          }
        }

        if (!user) {
          if (cleanEmail === 'test@bigboys.cl') {
            user = {
              id: 9999,
              fullName: 'Usuario de Prueba Big Boys',
              email: 'test@bigboys.cl',
              phone: '+56 9 8765 4321',
              rut: '19.342.110-3',

      async register({ fullName, email, phone, rut, password, avatarUrl = '' }) {

        const cleanPhone = (phone || '').trim();
        const cleanRut = ValidationUtils.cleanChileanRut(rut);
        const cleanPass = (password || '').trim();

        if (!cleanName || cleanName.length < 3) return { success: false, message: 'Ingresa tu nombre completo (mínimo 3 caracteres).' };
        if (!ValidationUtils.isValidChileanRut(cleanRut)) return { success: false, message: 'RUT chileno inválido (fórmula Módulo 11).' };
        if (!ValidationUtils.isValidEmail(cleanEmail)) return { success: false, message: 'Ingresa un correo electrónico válido.' };
        if (!cleanPhone) return { success: false, message: 'Ingresa tu teléfono de contacto.' };

        const passErrors = ValidationUtils.validatePasswordRequirements(cleanPass);
        if (passErrors.length > 0) return { success: false, message: `Contraseña: ${passErrors.join(', ')}` };

        const formattedRut = ValidationUtils.formatChileanRut(cleanRut);
        let users = this.getUsers();

        // --- VERIFICACIÓN PREVIA EN SUPABASE (tabla usuario; el RUT no se almacena por minimización) ---
        const sb = this.getCloudClient();
        if (sb) {
          try {
            const { data: exists } = await sb.rpc('api_usuario_existe', { p_email: cleanEmail });
            if (exists) {
              alert("Este correo ya está registrado en la app de Big Boys. Por favor inicia sesión.");
              return {
                success: false,
                message: "Este correo ya está registrado en la app de Big Boys. Por favor inicia sesión."
              };
            }

            // Si el usuario no existe en Supabase, purgar cualquier residuo huérfano local para sincronización exacta
            if (users.some(u => u.email.toLowerCase() === cleanEmail)) {
              users = users.filter(u => u.email.toLowerCase() !== cleanEmail);
              localStorage.setItem('bigboys_users', JSON.stringify(users));
            }
          } catch (sbErr) {
            console.warn("Aviso al verificar usuario en Supabase:", sbErr);
          }
        } else {
          // Si Supabase está offline o no disponible, verificar localmente
          if (users.some(u => u.email.toLowerCase() === cleanEmail)) {
            alert("Este correo ya está registrado en la app de Big Boys. Por favor inicia sesión.");
            return { success: false, message: "Este correo ya está registrado en la app de Big Boys. Por favor inicia sesión." };
          }
          if (users.some(u => ValidationUtils.cleanChileanRut(u.rut) === cleanRut)) {
            alert("Este RUT ya está registrado en la app de Big Boys. Por favor inicia sesión.");
            return { success: false, message: "Este RUT ya está registrado en la app de Big Boys. Por favor inicia sesión." };
          }
        }

        const passwordHash = await ValidationUtils.hashPassword(cleanPass);
        const newUser = {
          id: Date.now(),
          fullName: cleanName,
          email: cleanEmail,
          phone: cleanPhone,
          rut: formattedRut,
          passwordHash,
          avatarUrl: avatarUrl.trim(),
          createdAt: AppFormatters.currentDateTimeString()
        };

        users.push(newUser);
        localStorage.setItem('bigboys_users', JSON.stringify(users));
        localStorage.setItem('bigboys_logged_user', JSON.stringify(newUser));
        localStorage.setItem('bigboys_is_admin', 'false');

        // Registrar la cuenta en Supabase (usuario, rol CLIENTE, cliente y consentimiento)
        if (sb) {
          try {
            const { error } = await sb.rpc('api_registrar_cliente', {
              p_email: cleanEmail,
              p_nombre_completo: cleanName,
              p_telefono: cleanPhone,
              p_password_sha256: passwordHash,
              p_canal: 'WEB'
            });
            if (error) console.warn('Aviso al registrar usuario en Supabase:', error.message);
            else console.log("✓ Usuario registrado en Supabase (usuario + cliente):", cleanEmail);
          } catch (cloudErr) {
            console.warn("Aviso al guardar usuario en Supabase:", cloudErr);
          }
        }

        // Generar Cupón de Bienvenida PIN 4 dígitos
        const coupons = this.getCoupons();
        let couponPin = '';
        if (coupons.length < 100) {
          let isUnique = false;
          while (!isUnique) {
            couponPin = Math.floor(1000 + Math.random() * 9000).toString();
            if (!coupons.some(c => c.pin === couponPin)) isUnique = true;
          }
          coupons.push({
            id: Date.now(),
            pin: couponPin,
            userEmail: cleanEmail,
            userName: cleanName,
            isRedeemed: false,
            createdAt: AppFormatters.currentDateTimeString()
          });
          localStorage.setItem('bigboys_coupons', JSON.stringify(coupons));
        }

        this.addNotification(`¡Bienvenido ${cleanName}! 🎁`, couponPin ? `Cupón de cejas gratis generado con el PIN: ${couponPin}` : 'Bienvenido a Big Boys Barberías.');
        
        // Guardar automáticamente en la Base de Datos de Correos
        this.saveEmailToDatabase(cleanEmail, cleanName, cleanPhone, 'Registro Oficial', 'Cliente registrado con cuenta');
        
        // Envío Automático de Correo de Bienvenida con Regalo PIN
        this.sendWelcomeEmail(cleanName, cleanEmail, cleanPhone, cleanRut, couponPin);

        this.notify();
        return { success: true, user: newUser, couponPin };

      // Cálculo preciso de horas restantes hasta la cita
      getHoursUntilAppointment(dateTimeStr) {
        if (!dateTimeStr) return 0;
        try {
          const clean = dateTimeStr.trim().replace(/\//g, '-');
          const [datePart, timePart] = clean.split(' ');
          if (!datePart) return 0;
          const [y, m, d] = datePart.split('-').map(Number);
          const [h, min] = (timePart || '00:00').split(':').map(Number);
          const apptDate = new Date(y, m - 1, d, h, min);
          return (apptDate.getTime() - Date.now()) / (1000 * 60 * 60);
        } catch (e) {
          return 0;
        }
      }

      // Validación de política: >= 24 hrs y máx 2 reagendamientos
      canRescheduleAppointment(appt) {
        if (!appt) return { allowed: false, reason: 'Cita no encontrada.' };
        if (appt.status !== 'Confirmada') {
          return { allowed: false, reason: `Solo se pueden reagendar citas activas y confirmadas (estado actual: ${appt.status}).` };
        }
        const hoursLeft = this.getHoursUntilAppointment(appt.dateTime);
        if (hoursLeft < 24) {
          const hrs = Math.max(0, Math.round(hoursLeft));
          return {
            allowed: false,
            reason: `Solo se puede reagendar con al menos 24 horas de anticipación a la cita para liberar la agenda del barbero (quedan aprox. ${hrs} hrs).`,
            hoursLeft,
            rescheduleCount: appt.rescheduleCount || 0
          };
        }
        const count = appt.rescheduleCount || 0;
        if (count >= 2) {
          return {
            allowed: false,
            reason: 'Has alcanzado el límite máximo de 2 reagendamientos permitidos para este abono de $3.000.',
            hoursLeft,
            rescheduleCount: count
          };
        }
        return {
          allowed: true,
          hoursLeft,
          rescheduleCount: count,
          remainingReschedules: 2 - count
        };
      }

      // Reagendar cita reutilizando el abono de $3.000 (máx 2 veces)
      rescheduleAppointment(appointmentId, newDate, newHour) {
        const appointments = this.getAppointments();
        const appt = appointments.find(a => a.id === appointmentId || a.docId === appointmentId);
        if (!appt) return { success: false, error: 'Cita no encontrada.' };

        const check = this.canRescheduleAppointment(appt);
        if (!check.allowed) {
          return { success: false, error: check.reason };
        }

        const oldDateTime = appt.dateTime;
        const normalizedNewDate = AppFormatters.normalizeDateToYMD(newDate);
        const newDateTime = `${normalizedNewDate} ${newHour}`;

        appt.dateTime = newDateTime;
        appt.rescheduleCount = (appt.rescheduleCount || 0) + 1;
        appt.rescheduledAt = new Date().toISOString();
        appt.updatedAt = Date.now();

        // Actualizar docId único
        const safeDateKey = newDateTime.replace(/ /g, '_').replace(/:/g, '-');
        appt.docId = `loc${appt.locationId}_barber${appt.barberId}_${safeDateKey}`;

        localStorage.setItem('bigboys_appointments', JSON.stringify(appointments));

        // Sincronizar en Supabase (reserva + reagendamiento)
        this.rescheduleAppointmentInCloud(appt, oldDateTime);

        const locName = this.getLocations().find(l => l.id === appt.locationId)?.name || 'Big Boys';
        const bName = this.getBarbers().find(b => b.id === appt.barberId)?.name || 'Barbero';

        // Enviar correo de confirmación de reagendamiento
        if (appt.customerEmail) {
          this.sendRescheduleConfirmationEmail(appt, bName, locName, oldDateTime, newDateTime);
        }

        this.addNotification(
          '¡Cita Reagendada con Éxito! ✂️',
          `Tu nueva fecha es el ${newDateTime} hrs con ${bName}. Reagendamientos usados: ${appt.rescheduleCount}/2.`
        );
        this.notify();
        return { success: true, appointment: appt };
      }

      // Anulación por parte del cliente:
      // Si faltan >= 24 hrs: Devolución íntegra del abono de $3.000
      // Si faltan < 24 hrs: Pérdida del abono conforme a política No-Show
      cancelAppointmentByCustomer(appointmentId) {
        const appointments = this.getAppointments();
        const appt = appointments.find(a => a.id === appointmentId || a.docId === appointmentId);
        if (!appt) return { success: false, error: 'Cita no encontrada.' };

        const hoursLeft = this.getHoursUntilAppointment(appt.dateTime);
        const loc = this.getLocations().find(l => l.id === appt.locationId)?.name || 'Big Boys';
        const bar = this.getBarbers().find(b => b.id === appt.barberId)?.name || 'Barbero';
        const prepay = AppFormatters.formatClp(appt.prepayAmount || 3000);

        if (hoursLeft >= 24) {
          appt.status = 'Cancelada';
          appt.prepayForfeited = false;
          appt.cancelledBy = 'Cliente (Con anticipación >= 24h)';
          appt.updatedAt = Date.now();
          localStorage.setItem('bigboys_appointments', JSON.stringify(appointments));
          this.updateAppointmentStatusInCloud(appt, 'Cancelada');

          this.sendCancellationRefundEmail(appt, bar, loc);
          this.addNotification(
            'Cita Cancelada (Devolución del Abono) 💰',
            `Se canceló tu cita con anticipación. Se envió un correo a ${appt.customerEmail || 'tu email'} para transferirte los ${prepay}.`
          );
        } else {
          appt.status = 'Cancelada (Pérdida de Abono)';
          appt.prepayForfeited = true;
          appt.cancelledBy = 'Cliente (Tardía < 24h)';
          appt.updatedAt = Date.now();
          localStorage.setItem('bigboys_appointments', JSON.stringify(appointments));
          this.updateAppointmentStatusInCloud(appt, 'Cancelada (Pérdida de Abono)');

          this.sendNoShowForfeitEmail(appt, bar, loc);
          this.addNotification(
            'Cita Cancelada Fuera de Plazo ⚠️',
            `La cancelación se realizó con menos de 24 hrs de antelación. Conforme a las políticas, el abono de ${prepay} no es reembolsable.`
          );
        }

        this.notify();
        return { success: true, appointment: appt, hoursLeft };
      }

      confirmAndBook({ locationId, barberId, serviceName, servicePrice, prepayAmount = 3000, dateTime, customerName, customerPhone, customerEmail, isGuest = false }) {
        const appointments = this.getAppointments();
        const user = this.getLoggedInUser();

        // Normalizar formato de fecha a 'YYYY-MM-DD HH:mm'
        const normalizedDateTime = AppFormatters.normalizeDateTimeString(dateTime);

        const newAppointment = {
          id: Date.now(),
          locationId: Number(locationId),
          barberId: Number(barberId),
          serviceName,
          servicePrice: Number(servicePrice),
          prepayAmount: Number(prepayAmount) || 3000,
          rescheduleCount: 0,
          rescheduledAt: null,
          prepayForfeited: false,
          dateTime: normalizedDateTime,
          customerName: user ? user.fullName : customerName,
          customerPhone: user ? user.phone : customerPhone,
          customerEmail: user ? user.email : customerEmail,
          status: 'Confirmada',
          isGuest: !user || isGuest,
          userId: user ? user.id : null,
          hasReview: false,
          createdAt: AppFormatters.currentDateTimeString()
        };

        // Generar docId idéntico al estándar Android
        const safeDateKey = normalizedDateTime.replace(/ /g, '_').replace(/:/g, '-');
        newAppointment.docId = `loc${newAppointment.locationId}_barber${newAppointment.barberId}_${safeDateKey}`;

        appointments.unshift(newAppointment);
        localStorage.setItem('bigboys_appointments', JSON.stringify(appointments));

        // Sincronizar en tiempo real con Supabase PostgreSQL
        this.publishAppointmentToCloud(newAppointment);

        const locName = this.getLocations().find(l => l.id === locationId)?.name || 'Big Boys';
        const bName = this.getBarbers().find(b => b.id === barberId)?.name || 'Barbero';

        // Guardar correo en la Base de Datos y despachar correo automático de confirmación con comprobante Webpay
        if (newAppointment.customerEmail) {
          this.saveEmailToDatabase(

            newAppointment.customerPhone,
            newAppointment.isGuest ? 'Reserva Invitado' : 'Reserva Cliente',
            `Cita agendada: ${serviceName} para el ${normalizedDateTime}`

        this.addNotification('¡Cita Confirmada! ✂️', `Tu reserva para el ${normalizedDateTime} con ${bName} en ${locName} fue agendada con éxito.`);
        this.notify();
        return newAppointment;

      updateAppointmentStatusAdmin(appointmentId, newStatus) {
        const appointments = this.getAppointments();
        const appt = appointments.find(a => a.id === appointmentId || a.docId === appointmentId);
        if (appt) {
          const oldStatus = appt.status;

          if (newStatus === 'No-Show (Inasistencia)') {
            this.markNoShowAdmin(appointmentId);
            return;
          }

          appt.status = newStatus;
          if (newStatus.startsWith('Cancelada')) appt.cancelledBy = 'Administración';
          appt.updatedAt = Date.now();
          localStorage.setItem('bigboys_appointments', JSON.stringify(appointments));
          this.addNotification('Estado de Cita Actualizado', `Cita #${appointmentId} marcada como '${newStatus}'`);

          // Sincronizar actualización de estado en Supabase PostgreSQL
          this.updateAppointmentStatusInCloud(appt, newStatus);

          // Si el estado cambia a Cancelada, enviar correo automático de disculpas y devolución
          if (newStatus === 'Cancelada' && oldStatus !== 'Cancelada') {
            const loc = this.getLocations().find(l => l.id === appt.locationId)?.name || 'Big Boys';
            const bar = this.getBarbers().find(b => b.id === appt.barberId)?.name || 'Barbero';
            this.sendCancellationRefundEmail(appt, bar, loc);
          }

          this.notify();
        }

        };

        const safeDateKey = normalizedDateTime.replace(/ /g, '_').replace(/:/g, '-');
        newAppt.docId = `loc${newAppt.locationId}_barber${newAppt.barberId}_${safeDateKey}`;

        appointments.unshift(newAppt);
        localStorage.setItem('bigboys_appointments', JSON.stringify(appointments));

        this.publishAppointmentToCloud(newAppt);

        if (clientEmail) {
          this.saveEmailToDatabase(
            clientEmail,
            clientName,
            clientPhone,
            'Corte Presencial (Walk-in)',
            `Atención presencial: ${serviceName}`
          );
        }

        this.addNotification('Corte Manual (Walk-in)', `Servicio de ${clientName} registrado con éxito.`);
        this.notify();
        return newAppt;
      }

      addBarberAdmin({ name, locationId, specialty, bio, avatarUrl, initialHours = '09:00,10:00,11:00,12:00,14:00,15:00,16:00,17:00,18:00' }) {
        const barbers = this.getBarbers();
        const newBarber = {
          id: Date.now(),
          locationId: parseInt(locationId, 10),
          name: name.trim(),
          specialty: specialty.trim() || 'Barbero Estilista',
          rating: 5.0,
          avatarUrl: avatarUrl.trim() || 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=300',
          availableHours: initialHours.trim(),
          bio: bio.trim() || 'Barbero profesional de Big Boys Barberías Chile.',
          active: true
        };
        barbers.push(newBarber);
        localStorage.setItem('bigboys_barbers', JSON.stringify(barbers));
        this.addNotification('Nuevo Barbero Agregado 💈', `${newBarber.name} incorporado al equipo.`);
        this.notify();
      }

      deleteBarberAdmin(barberId) {
        let barbers = this.getBarbers().filter(x => x.id !== barberId);
        localStorage.setItem('bigboys_barbers', JSON.stringify(barbers));
        this.addNotification('Barbero Eliminado ✂️', 'Barbero removido del catálogo.');
        this.notify();
      }

      updateBarberAdmin(barberId, { name, locationId, specialty, bio, avatarUrl, availableHours, active }) {
        const barbers = this.getBarbers();
        const b = barbers.find(x => x.id === barberId);
        if (b) {
          if (name) b.name = name.trim();
          if (locationId) b.locationId = parseInt(locationId, 10);
          if (specialty) b.specialty = specialty.trim();
          if (bio !== undefined) b.bio = bio.trim();
          if (avatarUrl) b.avatarUrl = avatarUrl.trim();
          if (availableHours !== undefined) b.availableHours = availableHours.trim();
          if (active !== undefined) b.active = active;
          localStorage.setItem('bigboys_barbers', JSON.stringify(barbers));
          this.addNotification('Barbero Actualizado 💈', `Datos de ${b.name} guardados con éxito.`);
          this.notify();
          return { success: true };
        }
        return { success: false, message: 'Barbero no encontrado.' };
      }

      toggleBarberAvailability(barberId) {
        const barbers = this.getBarbers();
        const b = barbers.find(x => x.id === barberId);
        if (b) {
          const defaultH = '10:00,11:00,12:00,14:00,15:00,16:00,17:00,18:00,19:00';
          b.availableHours = (!b.availableHours || b.availableHours === 'NO_DISPONIBLE') ? defaultH : 'NO_DISPONIBLE';
          localStorage.setItem('bigboys_barbers', JSON.stringify(barbers));
          this.addNotification('Disponibilidad Modificada', `${b.name} ahora está: ${b.availableHours === 'NO_DISPONIBLE' ? 'NO DISPONIBLE' : 'DISPONIBLE'}`);
          this.notify();
        }
      }

      rateBarber(barberId, userRating) {
        const barbers = this.getBarbers();
        const b = barbers.find(x => x.id === barberId);
        if (b) {
          b.rating = Math.min(5.0, Math.round(((b.rating * 4 + userRating) / 5) * 10) / 10);
          localStorage.setItem('bigboys_barbers', JSON.stringify(barbers));
          this.addNotification('Calificación Registrada ⭐', `Has valorado a ${b.name} con ${userRating} estrellas.`);
          this.notify();
        }
      }

      submitReview({ appointmentId, locationId, barberId, rating, comment, tags = [], serviceOrSubject, reviewType = 'SERVICE' }) {
        const reviews = this.getReviews();
        const user = this.getLoggedInUser();
        const newRev = {
          id: Date.now(),
          appointmentId,
          locationId,
          barberId,
          authorName: user ? user.fullName : 'Cliente Big Boys',
          authorAvatarUrl: user ? user.avatarUrl : '',
          rating: Math.max(1, Math.min(5, parseInt(rating, 10))),
          comment: comment.trim(),
          serviceOrSubject: serviceOrSubject || 'Experiencia Big Boys',
          date: AppFormatters.currentDateString(),
          tags: Array.isArray(tags) ? tags.join(', ') : tags,
          reviewType
        };
        reviews.unshift(newRev);
        localStorage.setItem('bigboys_reviews', JSON.stringify(reviews));

        if (appointmentId) {
          const appointments = this.getAppointments();
          const appt = appointments.find(a => a.id === appointmentId);
          if (appt) {
            appt.hasReview = true;
            localStorage.setItem('bigboys_appointments', JSON.stringify(appointments));
          }
        }
        this.addNotification('¡Reseña Publicada! ⭐', 'Muchas gracias por tu valoración.');
        this.notify();
        return newRev;
      }

      deleteReviewAdmin(reviewId) {
        let reviews = this.getReviews().filter(r => r.id !== reviewId);
        localStorage.setItem('bigboys_reviews', JSON.stringify(reviews));
        this.addNotification('Reseña Eliminada 🗑️', 'La reseña fue removida por administración.');
        this.notify();
      }

      redeemCoupon(pin) {
        const coupons = this.getCoupons();
        const coupon = coupons.find(c => c.pin === pin.trim());
        if (!coupon) return { success: false, message: 'PIN no encontrado.' };
        if (coupon.isRedeemed) return { success: false, message: `El cupón ya fue canjeado por ${coupon.userName}.` };
        coupon.isRedeemed = true;
        localStorage.setItem('bigboys_coupons', JSON.stringify(coupons));
        this.addNotification('Regalo Entregado 🎁', `Canjeado perfilado de cejas para: ${coupon.userName}`);
        this.notify();
        return { success: true, message: `¡Cupón canjeado con éxito para ${coupon.userName}!` };
      }

      updateAdminProfile(name, currentPin, newPin, avatarUrl) {
        const config = this.getAdminConfig();
        if (currentPin !== config.pin) return { success: false, message: 'PIN actual incorrecto.' };
        if (!name.trim()) return { success: false, message: 'El nombre no puede estar vacío.' };
        if (newPin && newPin.length < 4) return { success: false, message: 'El nuevo PIN debe tener al menos 4 dígitos.' };

        config.name = name.trim();
        if (newPin) config.pin = newPin.trim();
        if (avatarUrl) config.avatarUrl = avatarUrl.trim();
        localStorage.setItem('bigboys_admin_config', JSON.stringify(config));

        const user = this.getLoggedInUser();
        if (user && user.id === -99) {
          user.fullName = config.name;
          user.avatarUrl = config.avatarUrl;
          localStorage.setItem('bigboys_logged_user', JSON.stringify(user));
        }
        this.addNotification('Perfil Administrador Actualizado', 'Cambios guardados con éxito.');
        this.notify();
        return { success: true, message: 'Perfil actualizado con éxito.' };
      }

      async updateUserProfile(name, phone, currentPassword, newPassword, avatarUrl) {
        const user = this.getLoggedInUser();
        if (!user || user.id <= 0) return { success: false, message: 'No hay sesión activa.' };
        const cleanName = (name || '').trim();
        const cleanPhone = (phone || '').trim();
        if (!cleanName) return { success: false, message: 'Ingresa tu nombre.' };
        if (!cleanPhone) return { success: false, message: 'Ingresa tu teléfono.' };

        if (user.passwordHash) {
          const enteredHash = await ValidationUtils.hashPassword(currentPassword || '');
          if (enteredHash !== user.passwordHash) return { success: false, message: 'Contraseña actual incorrecta.' };
        }

        let updatedPasswordHash = user.passwordHash;
        if (newPassword) {
          const passErrors = ValidationUtils.validatePasswordRequirements(newPassword);
          if (passErrors.length > 0) return { success: false, message: passErrors.join(', ') };
          updatedPasswordHash = await ValidationUtils.hashPassword(newPassword);
        }

        user.fullName = cleanName;
        user.phone = cleanPhone;
        user.passwordHash = updatedPasswordHash;
        if (avatarUrl) user.avatarUrl = avatarUrl.trim();

        const users = this.getUsers();
        const idx = users.findIndex(u => u.id === user.id);
        if (idx !== -1) {
          users[idx] = user;
          localStorage.setItem('bigboys_users', JSON.stringify(users));
        }
        localStorage.setItem('bigboys_logged_user', JSON.stringify(user));
        this.addNotification('Perfil Actualizado 👤', 'Datos modificados con éxito.');
        this.notify();
        return { success: true, message: 'Perfil actualizado con éxito.' };
      }

      updateGmailConfig(senderEmail, appPassword) {
        const config = { senderEmail: senderEmail.trim(), appPassword: appPassword.replace(/\s+/g, '').trim() };
        localStorage.setItem('bigboys_gmail_config', JSON.stringify(config));
        this.addNotification('Configuración Gmail Guardada ✉️', 'Credenciales actualizadas.');
        this.notify();
        return { success: true };
      }

      addNotification(title, message) {
        const notifications = this.getNotifications();
        notifications.unshift({
          id: Date.now() + Math.floor(Math.random() * 1000),
          title,
          message,
          timestamp: AppFormatters.currentTimeString()
        });
        localStorage.setItem('bigboys_notifications', JSON.stringify(notifications.slice(0, 30)));
        this.notify();
      }

      clearNotifications() {
        localStorage.setItem('bigboys_notifications', JSON.stringify([]));
        this.notify();
      }
    }

              onFinish();
              return 100;

            return prev + 35;

                  <h3 className="text-xl font-black italic text-white font-brand">DEJAR MI RESEÑA OFICIAL</h3>
                  <p className="text-xs text-zinc-400">Tu opinión nos ayuda a mantener el estándar en Big Boys Chile.</p>

                <form onSubmit={handleSubmitReview} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-zinc-300 text-center mb-1">Tu Calificación:</label>

    // History Screen
    // History Screen con Reagendamiento y Políticas de Abono
    function HistoryScreen({ user, appointments, locations, barbers, onOpenProfile, onOpenBooking }) {
      const [reviewingAppt, setReviewingAppt] = useState(null);
      const [rating, setRating] = useState(5);
      const [comment, setComment] = useState('');

      // Estado para modal de reagendamiento
      const [reschedulingAppt, setReschedulingAppt] = useState(null);
      const [rescheduleDate, setRescheduleDate] = useState('');
      const [rescheduleHour, setRescheduleHour] = useState('');
      const [rescheduleError, setRescheduleError] = useState('');

      const tomorrowStr = useMemo(() => {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }, []);

      const userAppointments = useMemo(() => {
        if (!user) return [];
        return appointments.filter(a => a.userId === user.id);
      }, [appointments, user]);

      const handleReviewSubmit = (e) => {
        e.preventDefault();
        if (!reviewingAppt) return;
        store.submitReview({
          appointmentId: reviewingAppt.id,
          locationId: reviewingAppt.locationId,
          barberId: reviewingAppt.barberId,
          rating,
          comment,
          tags: ['Cliente Verificado', 'Atención Oficial'],
          serviceOrSubject: reviewingAppt.serviceName,
          reviewType: 'SERVICE'
        });
        setReviewingAppt(null);
        setComment('');
      };

      // Barbero y horarios disponibles para reagendar
      const reschedulingBarber = useMemo(() => {
        if (!reschedulingAppt) return null;
        return barbers.find(b => b.id === reschedulingAppt.barberId);
      }, [reschedulingAppt, barbers]);

      const barberAvailableHours = useMemo(() => {
        if (!reschedulingBarber || !reschedulingBarber.availableHours || reschedulingBarber.availableHours === 'NO_DISPONIBLE') {
          return ['10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00', '18:00'];
        }
        return reschedulingBarber.availableHours.split(',').map(h => h.trim()).filter(Boolean);
      }, [reschedulingBarber]);

      const takenHoursForReschedule = useMemo(() => {
        if (!reschedulingAppt || !rescheduleDate) return new Set();
        const normSelected = AppFormatters.normalizeDateToYMD(rescheduleDate);
        const taken = (appointments || [])
          .filter(a => {
            if (!a || a.id === reschedulingAppt.id) return false;
            if (Number(a.barberId) !== Number(reschedulingAppt.barberId)) return false;
            if (!/^(Confirmada|Pendiente|Completada)/.test(a.status || 'Confirmada')) return false;
            const parts = (a.dateTime || '').trim().split(' ');
            return AppFormatters.normalizeDateToYMD(parts[0] || '') === normSelected;
          })
          .map(a => (a.dateTime || '').trim().split(' ')[1])
          .filter(Boolean);
        return new Set(taken);
      }, [reschedulingAppt, rescheduleDate, appointments]);

      const handleOpenReschedule = (appt) => {
        const check = store.canRescheduleAppointment(appt);
        if (!check.allowed) {
          alert(`⚠️ No es posible reagendar:\n\n${check.reason}`);
          return;
        }
        setReschedulingAppt(appt);
        setRescheduleDate(tomorrowStr);
        setRescheduleHour('');
        setRescheduleError('');
      };

      const handleConfirmReschedule = (e) => {
        e.preventDefault();
        setRescheduleError('');
        if (!rescheduleDate) {
          setRescheduleError('Selecciona una nueva fecha.');
          return;
        }
        if (!rescheduleHour) {
          setRescheduleError('Selecciona una hora disponible.');
          return;
        }

        const res = store.rescheduleAppointment(reschedulingAppt.id, rescheduleDate, rescheduleHour);
        if (res.success) {
          setReschedulingAppt(null);
        } else {
          setRescheduleError(res.error || 'No se pudo reagendar.');
        }
      };

      const handleCancelByCustomer = (appt) => {
        const hoursLeft = store.getHoursUntilAppointment(appt.dateTime);
        const prepayFormatted = AppFormatters.formatClp(appt.prepayAmount || 3000);

        if (hoursLeft >= 24) {
          const msg = `¿Deseas anular tu cita de ${appt.serviceName} para el ${appt.dateTime}?\n\n` +
            `✓ ANULACIÓN CON ANTICIPACIÓN (quedan aprox. ${Math.round(hoursLeft)} hrs para la cita):\n` +
            `Conforme a nuestras políticas, se gestionará la DEVOLUCIÓN ÍNTEGRA del 100% de tu abono (${prepayFormatted}) vía transferencia bancaria directa en un plazo de 24 a 48 hrs hábiles.\n\n` +
            `¿Confirmar anulación y solicitar devolución?`;
          if (confirm(msg)) {
            store.cancelAppointmentByCustomer(appt.id);
          }
        } else {
          const msg = `⚠️ ADVERTENCIA: POLÍTICA DE NO-SHOW / CANCELACIÓN TARDÍA\n\n` +
            `Faltan menos de 24 horas para tu atención (${Math.max(0, Math.round(hoursLeft))} hrs restantes).\n\n` +
            `Conforme a los términos informados al reservar, debido a que el bloque horario quedó bloqueado exclusivamente para ti, si anulas ahora PERDERÁS la totalidad de tu abono de ${prepayFormatted} (sin derecho a devolución ni saldo a favor).\n\n` +
            `¿Estás seguro/a de anular tu cita de todas formas?`;
          if (confirm(msg)) {
            store.cancelAppointmentByCustomer(appt.id);
          }
        }
      };

      return (
        <div className="space-y-6 pb-20 md:pb-12 animate-fade-in">
          {user && (
            <div className="bg-[#1E1E1E] border border-[#FFD700]/30 rounded-3xl p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="w-16 h-16 rounded-full bg-[#FFD700] text-black flex items-center justify-center font-black text-2xl shadow-lg">
                  {user.fullName ? user.fullName[0].toUpperCase() : 'U'}
                </div>
                <div>
                  <h2 className="text-xl font-black text-white">{user.fullName}</h2>
                  <span className="text-xs text-[#FFD700] font-extrabold block">⭐ Cliente Exclusivo Big Boys Chile</span>
                  <p className="text-xs text-zinc-400 mt-0.5">{user.email} · Tel: {user.phone} {user.rut ? `· RUT: ${user.rut}` : ''}</p>
                </div>
              </div>
              <button onClick={onOpenProfile} className="px-4 py-2 border border-[#FFD700] hover:bg-[#FFD700] hover:text-black text-[#FFD700] text-xs font-bold rounded-xl transition-all">
                ✏️ Editar Perfil
              </button>
            </div>
          )}

          <div>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-base font-black italic tracking-wide text-white font-brand uppercase">
                REGISTRO DE AGENDAMIENTOS ({userAppointments.length})
              </h3>
              <button onClick={onOpenBooking} className="text-xs font-bold text-[#FFD700] hover:underline">+ Nueva Cita</button>
            </div>

            {userAppointments.length === 0 ? (
              <div className="bg-[#1E1E1E] border border-zinc-800 rounded-2xl p-8 text-center">
                <span className="text-4xl block mb-2">📜</span>
                <p className="text-xs text-zinc-400 mb-4">Aún no registras atenciones en tu historial.</p>
                <button onClick={onOpenBooking} className="px-5 py-2.5 bg-[#FFD700] text-black font-black text-xs uppercase tracking-wider rounded-xl shadow-md">
                  Agendar mi primera cita
                </button>
              </div>
            ) : (
              <div className="space-y-4">
                {userAppointments.map(appt => {
                  const hoursLeft = store.getHoursUntilAppointment(appt.dateTime);
                  const rescheduleCount = appt.rescheduleCount || 0;
                  const isConfirmed = appt.status === 'Confirmada';
                  const isForfeited = Boolean(appt.prepayForfeited) || (appt.status && (appt.status.includes('Pérdida de Abono') || appt.status.includes('No-Show')));

                  return (
                    <div key={appt.id} className="bg-[#1E1E1E] border border-zinc-800 rounded-2xl p-5 flex flex-col justify-between gap-4">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                          <div className="flex items-center space-x-2 mb-1 flex-wrap gap-y-1">
                            <span className="text-base">💈</span>
                            <h4 className="text-sm font-extrabold text-white">{appt.serviceName}</h4>
                            <span className={`text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full ${
                              isConfirmed ? 'bg-green-500/15 text-green-400 border border-green-500/30' :
                              appt.status === 'Completada' ? 'bg-[#FFD700]/15 text-[#FFD700] border border-[#FFD700]/30' :
                              isForfeited ? 'bg-red-950/40 text-red-300 border border-red-500/40' :
                              'bg-amber-500/15 text-amber-300 border border-amber-500/30'
                            }`}>
                              {appt.status}
                            </span>
                            {rescheduleCount > 0 && (
                              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#FFD700]/15 text-[#FFD700] border border-[#FFD700]/30">
                                Reagendada {rescheduleCount}/2
                              </span>
                            )}
                          </div>
                          <p className="text-xs text-zinc-400">Fecha y Hora: <strong className="text-zinc-200">{appt.dateTime} hrs</strong></p>
                          <div className="flex items-center space-x-2 mt-1">
                            <span className="text-xs text-[#FFD700] font-semibold">Abono Webpay: {AppFormatters.formatClp(appt.prepayAmount || 3000)}</span>
                            <span className="text-[10px] text-zinc-500">• Saldo en local: {AppFormatters.formatClp(Math.max(0, (appt.servicePrice || 0) - (appt.prepayAmount || 3000)))}</span>
                          </div>
                        </div>
                        <div className="text-left sm:text-right">
                          <span className="text-base font-black text-[#FFD700]">{AppFormatters.formatClp(appt.servicePrice)}</span>
                          <span className="block text-[10px] text-zinc-400">Total del Servicio</span>
                        </div>
                      </div>

                      {/* Notificación de tiempo para cita confirmada */}
                      {isConfirmed && (
                        <div className="px-3 py-2 rounded-xl text-[11px] flex items-center justify-between gap-2 border bg-[#151515] border-zinc-800">
                          {hoursLeft >= 24 ? (
                            <span className="text-emerald-400 font-medium">
                              ⏱️ Faltan <strong>{Math.round(hoursLeft)} hrs</strong> para tu cita. Puedes reagendar (máx 2) o anular con 100% devolución.
                            </span>
                          ) : (
                            <span className="text-red-400 font-medium">
                              ⚠️ Faltan menos de 24 hrs ({Math.max(0, Math.round(hoursLeft))} hrs). Por política, el reagendamiento está cerrado y la anulación pierde el abono.
                            </span>
                          )}
                        </div>
                      )}

                      <div className="pt-3 border-t border-zinc-800 flex justify-between items-center text-xs">
                        {appt.hasReview ? (
                          <span className="text-xs text-[#FFD700] font-bold">★ ¡Ya calificaste este servicio! Gracias por tu reseña.</span>
                        ) : appt.status === 'Completada' ? (
                          <button onClick={() => setReviewingAppt(appt)} className="px-3 py-1.5 bg-[#FFD700] text-black font-bold text-xs rounded-lg hover:bg-[#E5C100]">
                            ⭐ Calificar Corte
                          </button>
                        ) : isConfirmed ? (
                          <div className="flex flex-wrap items-center justify-between w-full gap-2">
                            <div className="flex items-center space-x-2">
                              <button
                                onClick={() => handleOpenReschedule(appt)}
                                className={`px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all border ${
                                  hoursLeft >= 24 && rescheduleCount < 2
                                    ? 'bg-[#FFD700]/15 hover:bg-[#FFD700] text-[#FFD700] hover:text-black border-[#FFD700]/40'
                                    : 'bg-zinc-800 text-zinc-500 border-zinc-700 cursor-not-allowed'
                                }`}
                              >
                                ✂️ Reagendar Cita ({2 - rescheduleCount} restantes)
                              </button>
                            </div>
                            <button
                              onClick={() => handleCancelByCustomer(appt)}
                              className="px-2.5 py-1.5 bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-500/30 rounded-lg text-[11px] font-bold transition-colors"
                            >
                              Anular Cita
                            </button>
                          </div>
                        ) : isForfeited ? (
                          <span className="text-red-400 text-[11px] font-medium">
                            ⚠️ Cita anulada dentro de las 24 hrs o No-Show. Abono retenido conforme a política comercial.
                          </span>
                        ) : (
                          <span className="text-amber-400 text-[11px] font-medium">
                            ℹ️ Cita anulada con anticipación. Se envió correo para gestionar la devolución de tu abono de $3.000.
                          </span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Modal de Reagendamiento */}
          {reschedulingAppt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm animate-fade-in">
              <div className="bg-[#1E1E1E] border border-[#FFD700] rounded-3xl w-full max-w-md p-6 relative shadow-2xl space-y-4">
                <button onClick={() => setReschedulingAppt(null)} className="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
                <div>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-[#FFD700] block">REAGENDAMIENTO DE CITA</span>
                  <h3 className="text-base font-black text-white font-brand">{reschedulingAppt.serviceName}</h3>
                </div>

                <div className="p-3 bg-zinc-900 rounded-xl border border-zinc-800 text-xs space-y-1">
                  <p className="text-zinc-300">• Barbero: <strong className="text-white">{reschedulingBarber?.name || 'Barbero Asignado'}</strong></p>
                  <p className="text-zinc-300">• Hora actual: <strong className="text-zinc-400">{reschedulingAppt.dateTime} hrs</strong></p>
                  <p className="text-[#FFD700] font-semibold">• Abono: $3.000 CLP (se mantiene 100% válido)</p>
                  <p className="text-zinc-400">• Reagendamiento <strong className="text-white">{(reschedulingAppt.rescheduleCount || 0) + 1} de 2 permitidos</strong></p>
                </div>

                {rescheduleError && (
                  <div className="p-2.5 bg-red-950/40 border border-red-500/50 rounded-xl text-red-300 text-xs">
                    ⚠️ {rescheduleError}
                  </div>
                )}

                <form onSubmit={handleConfirmReschedule} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-zinc-300 mb-1">Nueva Fecha (mínimo 24 hrs en adelante):</label>
                    <input
                      type="date"
                      min={tomorrowStr}
                      value={rescheduleDate}
                      onChange={e => { setRescheduleDate(e.target.value); setRescheduleHour(''); }}
                      className="w-full px-3.5 py-2 rounded-xl bg-[#121212] border border-zinc-700 text-white text-xs font-bold"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-zinc-300 mb-1.5">Nuevo Horario Disponible:</label>
                    <div className="grid grid-cols-4 gap-1.5 max-h-40 overflow-y-auto pr-1">
                      {barberAvailableHours.map(hour => {
                        const isTaken = takenHoursForReschedule.has(hour);
                        const isSelected = rescheduleHour === hour;
                        return (
                          <button
                            type="button"
                            key={hour}
                            disabled={isTaken}
                            onClick={() => setRescheduleHour(hour)}
                            className={`py-2 rounded-lg text-xs font-bold border transition-all ${
                              isTaken ? 'bg-red-950/20 border-red-500/20 text-red-400/40 cursor-not-allowed' :
                              isSelected ? 'bg-[#FFD700] border-[#FFD700] text-black font-black' :
                              'bg-[#121212] border-zinc-800 text-zinc-200 hover:border-zinc-600'
                            }`}
                          >
                            {hour}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button type="button" onClick={() => setReschedulingAppt(null)} className="flex-1 py-2.5 bg-zinc-800 text-zinc-300 font-bold text-xs rounded-xl">Cancelar</button>
                    <button type="submit" className="flex-1 py-2.5 bg-[#FFD700] hover:bg-[#E5C100] text-black font-black text-xs uppercase tracking-wider rounded-xl shadow-md">
                      Confirmar Reagendamiento
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal de Calificación */}
          {reviewingAppt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-[#1E1E1E] border border-[#FFD700]/50 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
                <button onClick={() => setReviewingAppt(null)} className="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
                <h3 className="text-base font-black text-white font-brand mb-1">VALORAR SERVICIO: {reviewingAppt.serviceName}</h3>
                <form onSubmit={handleReviewSubmit} className="space-y-4 mt-4">
                  <div className="flex justify-center space-x-2 text-2xl text-[#FFD700]">
                    {[1, 2, 3, 4, 5].map(star => (
                      <button type="button" key={star} onClick={() => setRating(star)}>{star <= rating ? '★' : '☆'}</button>
                    ))}
                  </div>
                  <textarea rows={3} required value={comment} onChange={e => setComment(e.target.value)} placeholder="Comenta tu corte..." className="w-full px-3.5 py-2 rounded-xl bg-[#121212] border border-zinc-700 text-white text-xs"></textarea>
                  <div className="flex space-x-3">
                    <button type="button" onClick={() => setReviewingAppt(null)} className="flex-1 py-2 bg-zinc-800 text-zinc-300 font-bold text-xs rounded-xl">Cancelar</button>
                    <button type="submit" className="flex-1 py-2 bg-[#FFD700] text-black font-black text-xs uppercase rounded-xl">Enviar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Booking Wizard
    function BookingWizard({ isOpen, onClose, locations, barbers, appointments, user, preselectedBarber, preselectedLocation, onProceedToPayment }) {
      const [step, setStep] = useState(1);
      const [selectedLocation, setSelectedLocation] = useState(null);
      const [selectedBarber, setSelectedBarber] = useState(null);
      const [selectedService, setSelectedService] = useState(SERVICES_LIST[0]);
      const [selectedDate, setSelectedDate] = useState(AppFormatters.currentDateString());
      const [selectedHour, setSelectedHour] = useState('');
      const [guestName, setGuestName] = useState('');
      const [guestPhone, setGuestPhone] = useState('');
      const [guestEmail, setGuestEmail] = useState('');
      const [formError, setFormError] = useState('');

      const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());
      const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());

      useEffect(() => {
        if (preselectedBarber) {
          setSelectedBarber(preselectedBarber);
          const loc = locations.find(l => l.id === preselectedBarber.locationId);
          if (loc) setSelectedLocation(loc);
          setStep(3);
        } else if (preselectedLocation) {
          setSelectedLocation(preselectedLocation);
          setSelectedBarber(null);
          setStep(2);
        } else {
          setStep(1);
        }
        // Sin «locations» en las dependencias: la consulta periódica de reservas (cada 8 s) recrea
        // la lista y devolvía el asistente al paso 1 mientras el cliente reservaba.
      }, [isOpen, preselectedBarber, preselectedLocation]);

      // Mover todos los hooks useMemo ANTES de cualquier return condicional (Regla fundamental de React)
      const branchBarbers = useMemo(() => {
        if (!selectedLocation || !barbers) return [];
        return (barbers || []).filter(b => b && b.locationId === selectedLocation.id && b.active !== false && b.availableHours !== 'NO_DISPONIBLE');
      }, [selectedLocation, barbers]);

      const takenHours = useMemo(() => {
        if (!selectedBarber || !selectedDate || !appointments) return new Set();
        const normSelected = AppFormatters.normalizeDateToYMD(selectedDate);

        const taken = (appointments || [])
          .filter(a => {
            if (!a || Number(a.barberId) !== Number(selectedBarber.id)) return false;
            // Solo bloquean el horario las reservas pendientes de pago, confirmadas o atendidas
            if (!/^(Confirmada|Pendiente|Completada)/.test(a.status || 'Confirmada')) return false;
            if (!a.dateTime) return false;

            const parts = (a.dateTime || '').trim().split(' ');
            const apptDatePart = parts[0] || '';
            return AppFormatters.normalizeDateToYMD(apptDatePart) === normSelected;
          })
          .map(a => {
            const parts = (a.dateTime || '').trim().split(' ');
            return parts.length > 1 ? parts[1] : '';
          })
          .filter(Boolean);

        return new Set(taken);
      }, [selectedBarber, selectedDate, appointments]);

      const barberHours = useMemo(() => {
        if (!selectedBarber || !selectedBarber.availableHours || selectedBarber.availableHours === 'NO_DISPONIBLE') return [];
        return selectedBarber.availableHours.split(',').map(h => h.trim()).filter(Boolean);
      }, [selectedBarber]);

      const calendarDays = useMemo(() => {
        const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
        const totalDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();
        const days = [];
        const offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
        for (let i = 0; i < offset; i++) days.push(null);

        const today = new Date();
        const todayDay = today.getDate();
        const todayMonth = today.getMonth();
        const todayYear = today.getFullYear();

        for (let d = 1; d <= totalDays; d++) {
          const isPast = calendarYear < todayYear || (calendarYear === todayYear && calendarMonth < todayMonth) || (calendarYear === todayYear && calendarMonth === todayMonth && d < todayDay);
          const dateString = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({ dayNumber: d, dateString, isPast, isToday: calendarYear === todayYear && calendarMonth === todayMonth && d === todayDay });
        }
        return days;
      }, [calendarMonth, calendarYear]);

      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

      // Early return después de que TODOS los hooks se ejecutaron
      if (!isOpen) return null;

      const handleNextStep = () => {
        setFormError('');
        if (step === 1 && !selectedLocation) { setFormError('Selecciona una sucursal.'); return; }
        if (step === 2 && !selectedBarber) { setFormError('Selecciona un barbero.'); return; }
        if (step === 3 && !selectedService) { setFormError('Selecciona un servicio.'); return; }
        if (step === 4) {
          if (!selectedDate) { setFormError('Selecciona una fecha.'); return; }
          if (!selectedHour) { setFormError('Selecciona una hora disponible.'); return; }
        }
        setStep(step + 1);
      };

      const handleLaunchPayment = () => {
        setFormError('');
        if (!user) {
          if (!guestName.trim()) { setFormError('Ingresa tu nombre.'); return; }
          if (!guestPhone.trim()) { setFormError('Ingresa tu teléfono.'); return; }
        }

        onProceedToPayment({
          location: selectedLocation,
          barber: selectedBarber,
          service: selectedService,
          date: AppFormatters.normalizeDateToYMD(selectedDate),
          hour: selectedHour,
          guestName,
          guestPhone,
          guestEmail,
          prepayAmount: 3000
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/85 backdrop-blur-sm animate-fade-in overflow-y-auto">
          <div className="bg-[#1E1E1E] border border-[#FFD700] rounded-3xl w-full max-w-xl p-5 sm:p-7 relative shadow-2xl my-6 flex flex-col max-h-[92vh]">
            <div className="flex justify-between items-center pb-3 border-b border-zinc-800">
              <div>
                <span className="text-[10px] font-black uppercase text-[#FFD700] tracking-widest block">PASO {step} DE 5</span>
                <h3 className="text-base sm:text-lg font-black italic text-white font-brand">RESERVA DE ATENCIÓN BIG BOYS</h3>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center text-sm">✕</button>
            </div>

            <div className="w-full h-1.5 bg-zinc-800 rounded-full my-3 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-[#FFD700] to-[#E5C100] transition-all duration-300" style={{ width: `${(step / 5) * 100}%` }}></div>
            </div>

            {formError && <div className="p-2.5 mb-3 bg-red-950/40 border border-red-500/50 rounded-xl text-red-300 text-xs">⚠️ {formError}</div>}

            <div className="flex-1 overflow-y-auto pr-1 space-y-4 py-2">
              {step === 1 && (
                <div>
                  <h4 className="text-xs font-bold text-white mb-1">Paso 1: Selecciona la Sucursal</h4>
                  <div className="space-y-2.5 mt-2">
                    {locations.map(loc => {
                      const isSelected = selectedLocation?.id === loc.id;
                      return (
                        <div key={loc.id} onClick={() => setSelectedLocation(loc)} className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${isSelected ? 'bg-[#FFD700]/15 border-[#FFD700]' : 'bg-[#121212] border-zinc-800'}`}>
                          <div className="flex items-center space-x-3">
                            <span className="text-xl">📍</span>
                            <div>
                              <h5 className="text-xs font-bold text-white">{loc.name}</h5>
                              <p className="text-[11px] text-zinc-400">{loc.address}</p>
                            </div>
                          </div>
                          <input type="radio" checked={isSelected} onChange={() => setSelectedLocation(loc)} className="accent-[#FFD700]" />
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {step === 2 && (
                <div>
                  <h4 className="text-xs font-bold text-white mb-1">Paso 2: Selecciona tu Barbero</h4>
                  <div className="space-y-2.5 mt-2">
                    {branchBarbers.map(barber => {
                      const isSelected = selectedBarber?.id === barber.id;
                      return (
                        <div key={barber.id} onClick={() => setSelectedBarber(barber)} className={`p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${isSelected ? 'bg-[#FFD700]/15 border-[#FFD700]' : 'bg-[#121212] border-zinc-800'}`}>
                          <div className="flex items-center space-x-3">
                            <img src={barber.avatarUrl} alt={barber.name} className="w-12 h-12 rounded-full object-cover border-2 border-[#FFD700]" />
                            <div>
                              <h5 className="text-xs font-bold text-white">{barber.name}</h5>
                              <p className="text-[11px] text-zinc-400">{barber.specialty}</p>
                              <span className="text-[10px] text-[#FFD700]">★ {barber.rating.toFixed(1)}</span>
                            </div>
                          </div>
                          <input type="radio" checked={isSelected} onChange={() => setSelectedBarber(barber)} className="accent-[#FFD700]" />
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {step === 3 && (
                <div>
                  <h4 className="text-xs font-bold text-white mb-1">Paso 3: Selecciona el Servicio</h4>
                  <div className="space-y-2.5 mt-2">
                    {SERVICES_LIST.map(svc => {
                      const isSelected = selectedService?.name === svc.name;
                      return (
                        <div key={svc.id} onClick={() => setSelectedService(svc)} className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${isSelected ? 'bg-[#FFD700]/15 border-[#FFD700]' : 'bg-[#121212] border-zinc-800'}`}>
                          <div>
                            <h5 className="text-xs font-bold text-white">{svc.name}</h5>
                            <p className="text-[10px] text-zinc-400">Duración: {svc.duration}</p>
                          </div>
                          <span className="text-xs font-black text-[#FFD700]">{AppFormatters.formatClp(svc.price)}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {step === 4 && (
                <div className="space-y-4">
                  <h4 className="text-xs font-bold text-white mb-1">Paso 4: Selecciona Fecha y Hora</h4>
                  <div className="bg-[#121212] border border-zinc-800 rounded-2xl p-4">
                    <div className="flex justify-between items-center mb-3">
                      <span className="text-xs font-black uppercase text-[#FFD700]">{monthNames[calendarMonth]} {calendarYear}</span>
                      <div className="flex space-x-1">
                        <button onClick={() => setCalendarMonth(prev => prev > 0 ? prev - 1 : 11)} className="w-7 h-7 rounded-lg bg-zinc-800 text-xs">&larr;</button>
                        <button onClick={() => setCalendarMonth(prev => prev < 11 ? prev + 1 : 0)} className="w-7 h-7 rounded-lg bg-zinc-800 text-xs">&rarr;</button>
                      </div>
                    </div>

                    <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-zinc-500 mb-1">
                      <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
                    </div>

                    <div className="grid grid-cols-7 gap-1">
                      {calendarDays.map((dObj, idx) => {
                        if (!dObj) return <div key={idx} className="h-8"></div>;
                        const isSelected = selectedDate === dObj.dateString;
                        return (
                          <button
                            key={dObj.dateString}
                            disabled={dObj.isPast}
                            onClick={() => { setSelectedDate(dObj.dateString); setSelectedHour(''); }}
                            className={`h-8 rounded-lg text-xs font-bold ${dObj.isPast ? 'text-zinc-700 cursor-not-allowed' : isSelected ? 'bg-[#FFD700] text-black font-black' : 'text-zinc-200 hover:bg-zinc-800'}`}
                          >
                            {dObj.dayNumber}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div>
                    <span className="text-xs font-bold text-white block mb-2">Horarios disponibles:</span>
                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                      {barberHours.map(hour => {
                        const isTaken = takenHours.has(hour);
                        const isSelected = selectedHour === hour;
                        return (
                          <button
                            key={hour}
                            disabled={isTaken}
                            onClick={() => setSelectedHour(hour)}
                            className={`py-2 px-1 rounded-xl text-xs font-bold border ${
                              isTaken ? 'bg-red-950/20 border-red-500/30 text-red-400/50 cursor-not-allowed' :
                              isSelected ? 'bg-[#FFD700] border-[#FFD700] text-black font-black' :
                              'bg-[#121212] border-zinc-800 text-white'
                            }`}
                          >
                            <span>{hour} hrs</span>
                            {isTaken && <span className="block text-[8px] uppercase">Ocupado</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {step === 5 && (
                <div className="space-y-4">
                  <h4 className="text-xs font-bold text-white">Paso 5: Resumen de tu Agendamiento</h4>
                  <div className="p-4 rounded-2xl bg-[#1E1A16] border border-[#FFD700]/50 space-y-2 text-xs">
                    <p>🕰️ Fecha y Hora: <strong className="text-white">{selectedDate} a las {selectedHour} hrs</strong></p>

      const parseApptDateTime = (dateTimeStr) => {

        const parts = dateTimeStr.trim().split(' ');

        const timePart = parts[1] || '00:00';
        const [hour, minute] = timePart.split(':').map(Number);

        if (dateTokens[0] > 1000) {
          // yyyy-MM-dd
          year = dateTokens[0];
          month = dateTokens[1];
          day = dateTokens[2];
        } else {
          // dd-MM-yyyy
          day = dateTokens[0];
          month = dateTokens[1];
          year = dateTokens[2];

        if (!day || !month || !year) return new Date(0);
        return new Date(year, month - 1, day, hour || 0, minute || 0);
