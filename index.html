            count: dataForDay ? dataForDay.total : 0,
            confirmadas: dataForDay ? dataForDay.confirmadas : 0,
            completadas: dataForDay ? dataForDay.completadas : 0,
            canceladas: dataForDay ? dataForDay.canceladas : 0
          });
        }
        return days;
      }, [agendaCalendarMonth, agendaCalendarYear, agendaSelectedDate, agendaDateFilter, apptsByDateMap]);

      // Citas de la agenda con filtros completos y ordenamiento cronológico por fecha
      const filteredAgendaAppointments = useMemo(() => {
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        const tomDate = new Date();
        tomDate.setDate(tomDate.getDate() + 1);
        const tomorrowStr = `${tomDate.getFullYear()}-${String(tomDate.getMonth() + 1).padStart(2, '0')}-${String(tomDate.getDate()).padStart(2, '0')}`;

        // Rango de la semana actual (Lunes a Domingo)
        const dayOfWeek = now.getDay() || 7;
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
        startOfWeek.setHours(0, 0, 0, 0);
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(startOfWeek.getDate() + 6);
        endOfWeek.setHours(23, 59, 59, 999);

        const currentMonthYm = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        return (appointments || []).filter(a => {
          // 1. Filtro de Estado
          if (agendaStatusFilter !== 'all') {
            if (agendaStatusFilter === 'Cancelada') {
              if (a.status !== 'Cancelada' && a.status !== 'Cancelada (Devolución Abono)') return false;
            } else if (agendaStatusFilter === 'No-Show (Inasistencia)') {
              if (a.status !== 'No-Show (Inasistencia)' && a.status !== 'Cancelada (Pérdida de Abono)') return false;
            } else if (a.status !== agendaStatusFilter) {
              return false;
            }
          }

          // 2. Filtro de Sucursal
          if (agendaBranchFilter !== 'all' && a.locationId !== parseInt(agendaBranchFilter, 10)) {
            return false;
          }

          // 3. Filtro de Barbero
          if (agendaBarberFilter !== 'all' && a.barberId !== parseInt(agendaBarberFilter, 10)) {
            return false;
          }

          // 4. Búsqueda por texto (nombre, celular, correo, servicio o ID #)
          if (agendaSearch.trim()) {
            const q = agendaSearch.toLowerCase().trim();
            const clientName = (a.customerName || '').toLowerCase();
            const clientPhone = (a.customerPhone || '').toLowerCase();
            const clientEmail = (a.customerEmail || '').toLowerCase();
            const service = (a.serviceName || '').toLowerCase();
            const idStr = String(a.id);
            if (!clientName.includes(q) && !clientPhone.includes(q) && !clientEmail.includes(q) && !service.includes(q) && !idStr.includes(q)) {
              return false;
            }
          }

          // 5. Filtro de Fecha & Calendario
          const aDateYmd = AppFormatters.normalizeDateToYMD(a.dateTime);
          const aDateObj = parseApptDateTime(a.dateTime);

          if (agendaDateFilter === 'today') {
            return aDateYmd === todayStr;
          } else if (agendaDateFilter === 'tomorrow') {
            return aDateYmd === tomorrowStr;
          } else if (agendaDateFilter === 'this_week') {
            return aDateObj >= startOfWeek && aDateObj <= endOfWeek;
          } else if (agendaDateFilter === 'this_month') {
            return aDateYmd.startsWith(currentMonthYm);
          } else if (agendaDateFilter === 'custom') {
            return aDateYmd === agendaSelectedDate;
          }

          return true; // 'all'
        }).sort((a, b) => {
          const timeA = parseApptDateTime(a.dateTime).getTime();
          const timeB = parseApptDateTime(b.dateTime).getTime();
          if (agendaDateSort === 'asc') {
            return timeA - timeB;
          } else {
            return timeB - timeA;
          }
        });
      }, [appointments, agendaStatusFilter, agendaBranchFilter, agendaBarberFilter, agendaSearch, agendaDateFilter, agendaSelectedDate, agendaDateSort]);

      // Métricas KPI de la agenda filtrada
      const agendaKpis = useMemo(() => {
        const total = filteredAgendaAppointments.length;
        const confirmadas = filteredAgendaAppointments.filter(a => a.status === 'Confirmada').length;
        const completadas = filteredAgendaAppointments.filter(a => a.status === 'Completada').length;
        const canceladas = filteredAgendaAppointments.filter(a => (a.status || '').includes('Cancelada') || (a.status || '').includes('No-Show')).length;
        const abonosTotal = filteredAgendaAppointments.filter(a => a.status !== 'Cancelada').reduce((sum, a) => sum + (Number(a.prepayAmount) || 3000), 0);
        const valorTotal = filteredAgendaAppointments.filter(a => a.status !== 'Cancelada').reduce((sum, a) => sum + (Number(a.servicePrice) || 0), 0);
        const saldoCaja = Math.max(0, valorTotal - abonosTotal);
        return { total, confirmadas, completadas, canceladas, abonosTotal, valorTotal, saldoCaja };
      }, [filteredAgendaAppointments]);

        const filename = `BigBoys_Reporte_Excel_${excelPeriod.toUpperCase()}_${AppFormatters.currentDateString()}.xlsx`;

        if (window.XLSX) {

          const wsCitas = window.XLSX.utils.json_to_sheet(rowsSheet1.length > 0 ? rowsSheet1 : [{ "Información": "No hay movimientos registrados en este periodo" }]);

    function BarberDashboard({ barber, locations, barbers, appointments, onLogout }) {
      const todayIso = new Date().toISOString().split('T')[0];
      const [selectedDate, setSelectedDate] = useState(todayIso);
      const [cancelingAppt, setCancelingAppt] = useState(null);
      const [emergencyReason, setEmergencyReason] = useState('Emergencia médica del barbero');
      const [customReason, setCustomReason] = useState('');
      const [processingAction, setProcessingAction] = useState(false);

      const loc = locations.find(l => l.id === barber.locationId) || { name: 'Sucursal Big Boys' };

      // Filtrar citas correspondientes a este barbero y a la fecha seleccionada
      const barberAppts = appointments.filter(a => {
        if (a.barberId !== barber.id) return false;
        if (!a.dateTime) return false;
        const parts = a.dateTime.split(' ')[0];
        let apptIso = parts;
        if (parts.includes('-')) {
          const segs = parts.split('-');
          if (segs[0].length === 2 && segs[2].length === 4) {
            apptIso = `${segs[2]}-${segs[1]}-${segs[0]}`;
          }
        }
        return apptIso === selectedDate;
      }).sort((a, b) => {
        const timeA = (a.dateTime || '').split(' ')[1] || '';
        const timeB = (b.dateTime || '').split(' ')[1] || '';
        return timeA.localeCompare(timeB);
      });

      // Métricas del día seleccionado
      const totalApptsCount = barberAppts.length;
      const pendingCount = barberAppts.filter(a => a.status === 'Confirmada').length;
      const completedCount = barberAppts.filter(a => a.status === 'Completada').length;
      const canceledCount = barberAppts.filter(a => a.status === 'Cancelada').length;
      const totalRevenueDay = barberAppts
        .filter(a => a.status !== 'Cancelada')
        .reduce((sum, a) => sum + (Number(a.servicePrice) || 0), 0);
      const totalPrepayDay = barberAppts
        .filter(a => a.status !== 'Cancelada')
        .reduce((sum, a) => sum + (Number(a.prepayAmount) || 0), 0);
      const totalCashPendingDay = Math.max(0, totalRevenueDay - totalPrepayDay);

      // Confirmar cancelación por emergencia
      const handleConfirmEmergencyCancel = async () => {
        if (!cancelingAppt) return;
        setProcessingAction(true);
        const finalReason = emergencyReason === 'Otro' ? (customReason.trim() || 'Emergencia de fuerza mayor') : emergencyReason;
        const res = store.cancelAppointmentByBarber(cancelingAppt.id, finalReason);
        setProcessingAction(false);
        if (res.success) {
          setCancelingAppt(null);
        } else {
          alert('Error al cancelar: ' + res.message);
        }
      };

      // Marcar como completada
      const handleCompleteAppointment = (apptId) => {
        store.completeAppointmentByBarber(apptId);
      };

        <div className="space-y-6 animate-fade-in pb-12">

            <div className="bg-[#1E1E1E] border border-zinc-800 rounded-2xl p-4">

          {/* Listado de Citas de la Agenda */}

    // ==========================================
    // 4b. MÓDULO S12: PERSONAL, WEBPAY, FILA Y «MIS DATOS» (API api_* de Supabase)
    // ==========================================
    const STAFF_KEY = 'bigboys_staff_session';
    const ROLE_LABELS = { DUENO: 'Dueño / Administración', ADMIN_SUCURSAL: 'Cajero/a de sucursal', BARBERO: 'Barbero', CLIENTE: 'Cliente' };
    const QUEUE_LABELS = { EN_ESPERA: 'En espera', LLAMADO: 'Llamado', EN_ATENCION: 'En atención', ATENDIDO: 'Atendido', ABANDONO: 'Se fue' };
    const QUEUE_COLORS = { EN_ESPERA: 'text-zinc-300', LLAMADO: 'text-[#FFD700]', EN_ATENCION: 'text-cyan-400', ATENDIDO: 'text-emerald-400', ABANDONO: 'text-red-400' };

    // Mensajes de los errores que devuelve la base de datos (RAISE EXCEPTION 'CODIGO')
    const API_ERRORS = {
      CREDENCIALES_INVALIDAS: 'Correo o contraseña incorrectos.',
      SIN_PERMISO: 'Tu cuenta no tiene permiso para esta acción.',
      HORARIO_OCUPADO: 'Ese horario ya fue tomado. Elige otra hora.',
      BARBERO_REQUERIDO: 'Selecciona el barbero que atenderá.',
      NOMBRE_REQUERIDO: 'Ingresa el nombre.',
      CORREO_INVALIDO: 'Ingresa un correo válido.',
      CORREO_YA_REGISTRADO: 'Ese correo ya tiene una cuenta.',
      CLAVE_INVALIDA: 'La contraseña no es válida.',
      PAGO_NO_ENCONTRADO: 'No encontramos el pago. Si se descontó dinero, contáctanos con tu comprobante.',
      RESERVA_NO_PENDIENTE: 'La reserva ya no está pendiente de pago.',
      SOLO_CLIENTES: 'Esta opción es solo para clientes.'
    };
    function apiErrorMessage(error) {
      const msg = (error && error.message) || String(error || '');
      const code = Object.keys(API_ERRORS).find(k => msg.includes(k));
      if (code) return API_ERRORS[code];
      if (msg.includes('WEBPAY_ERROR')) return 'Webpay no respondió. Intenta nuevamente en unos minutos.';
      return msg || 'Ocurrió un error. Intenta nuevamente.';
    }

    async function callApi(fn, params) {
      const sb = window.supabaseClient;
      if (!sb) throw new Error('Sin conexión con la base de datos (Supabase).');
      const { data, error } = await sb.rpc(fn, params || {});
      if (error) throw new Error(apiErrorMessage(error));
      return data;
    }

    const StaffSession = {
      get() {
        try { return JSON.parse(sessionStorage.getItem(STAFF_KEY) || 'null'); } catch (e) { return null; }
      },
      set(s) { sessionStorage.setItem(STAFF_KEY, JSON.stringify(s)); },
      clear() { sessionStorage.removeItem(STAFF_KEY); },
      creds(s) { return { p_email: s.email, p_password_sha256: s.hash }; }
    };

    // Contraseña temporal legible para entregar en persona (sin caracteres ambiguos)
    function generateTempPassword() {
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
      const bytes = new Uint8Array(10);
      crypto.getRandomValues(bytes);
      return 'BB-' + Array.from(bytes, b => chars[b % chars.length]).join('');
    }

    const inputCls = 'w-full px-3 py-2 rounded-xl bg-[#121212] border border-zinc-700 text-white text-xs focus:border-[#FFD700] focus:outline-none';
    const cardCls = 'bg-[#1E1E1E] border border-zinc-800 rounded-2xl p-4';

    // ---------- Ingreso del personal (cuentas creadas por el Dueño) ----------
    function StaffLoginForm({ allowedRoles, accent = 'cyan', title, description, onSuccess }) {
      const [email, setEmail] = useState('');
      const [pass, setPass] = useState('');
      const [pending, setPending] = useState(null); // cuenta que debe cambiar la clave temporal
      const [newPass, setNewPass] = useState('');
      const [newPass2, setNewPass2] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const btn = accent === 'red' ? 'bg-red-600 hover:bg-red-500' : 'bg-cyan-600 hover:bg-cyan-500';

      const finish = (u, hash) => {
        const session = { id: u.id, email: u.email, hash, role: u.role, name: u.full_name, locationId: u.location_id || null };
        StaffSession.set(session);
        onSuccess(session);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const hash = await ValidationUtils.hashPassword(pass);
          const u = await callApi('api_login', { p_email: email.trim().toLowerCase(), p_password_sha256: hash });
          if (!u) throw new Error('Correo o contraseña incorrectos (tras 5 intentos la cuenta se bloquea).');
          if (!allowedRoles.includes(u.role)) throw new Error(`Esta cuenta es de ${ROLE_LABELS[u.role] || u.role}; usa la pestaña que corresponde.`);
          if (u.must_change_password) setPending({ u, hash });
          else finish(u, hash);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleChange = async (e) => {
        e.preventDefault();
        setError('');
        const errs = ValidationUtils.validatePasswordRequirements(newPass);
        if (errs.length) return setError(`Contraseña: ${errs.join(', ')}`);
        if (newPass !== newPass2) return setError('Las contraseñas no coinciden.');
        setLoading(true);
        try {
          const newHash = await ValidationUtils.hashPassword(newPass);
          const u = await callApi('api_actualizar_perfil', {
            p_email: pending.u.email, p_password_sha256: pending.hash, p_nueva_password_sha256: newHash
          });
          finish({ ...pending.u, ...u }, newHash);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-4">
          <div className={`p-3 rounded-xl text-xs flex items-start space-x-2 ${accent === 'red' ? 'bg-red-950/30 border border-red-500/40 text-red-200' : 'bg-cyan-950/30 border border-cyan-500/40 text-cyan-200'}`}>
            <span className="text-base">{accent === 'red' ? '🛡️' : '💈'}</span>
            <div>
              <strong className="block text-white">{pending ? 'Crea tu contraseña personal' : title}</strong>
              <span className="text-[11px] text-zinc-400">{pending ? 'Es tu primer ingreso: la contraseña temporal que te entregaron debe reemplazarse.' : description}</span>
            </div>
          </div>
          {error && <div className="p-3 bg-red-950/50 border border-red-500/50 rounded-xl text-red-300 text-xs">⚠️ {error}</div>}
          {!pending ? (
            <form onSubmit={handleLogin} className="space-y-3">
              <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="correo@bigboys.cl" className={inputCls} />
              <input type="password" required value={pass} onChange={e => setPass(e.target.value)} placeholder="Contraseña" className={inputCls} />
              <button type="submit" disabled={loading} className={`w-full py-3 ${btn} text-white font-black text-xs uppercase tracking-wider rounded-xl shadow-lg transition-all`}>
                {loading ? 'Verificando…' : 'Ingresar →'}
              </button>
              <p className="text-[10px] text-zinc-500 text-center">Las cuentas del personal las crea solo la administración. ¿Olvidaste tu clave? Pide una nueva clave temporal.</p>
            </form>
          ) : (
            <form onSubmit={handleChange} className="space-y-3">
              <input type="password" required value={newPass} onChange={e => setNewPass(e.target.value)} placeholder="Nueva contraseña" className={inputCls} />
              <input type="password" required value={newPass2} onChange={e => setNewPass2(e.target.value)} placeholder="Repite la nueva contraseña" className={inputCls} />
              <button type="submit" disabled={loading} className={`w-full py-3 ${btn} text-white font-black text-xs uppercase rounded-xl`}>
                {loading ? 'Guardando…' : 'Guardar y entrar'}
              </button>
            </form>
          )}
        </div>
      );
    }

    // ---------- Webpay Plus: pago real del abono (ambiente de integración de Transbank) ----------
    function buildWebpayPayload(draft, user) {
      return {
        id: Date.now(),
        canal: 'WEB',
        barber_id: Number(draft.barber.id),
        location_id: Number(draft.location.id),
        service_name: draft.service.name,
        date_time: AppFormatters.normalizeDateTimeString(`${draft.date} ${draft.hour}`),
        customer_name: user ? user.fullName : (draft.guestName || ''),
        customer_phone: user ? (user.phone || '') : (draft.guestPhone || ''),
        customer_email: user ? user.email : (draft.guestEmail || '')
      };
    }

    // Webpay recibe el token por POST desde un formulario (así lo exige Transbank)
    function redirectToWebpay(url, token) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = url;
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'token_ws';
      input.value = token;
      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();
    }

    function WebpayModal({ isOpen, bookingDraft, onCancel }) {
      const [loading, setLoading] = useState(false);

      if (!isOpen || !bookingDraft) return null;

      const amountToPay = bookingDraft.prepayAmount || 3000;

      const handlePay = async () => {
        setError('');
        setLoading(true);
        try {
          const returnUrl = window.location.origin + window.location.pathname;
          const tx = await callApi('api_webpay_iniciar', { p: buildWebpayPayload(bookingDraft, user), p_return_url: returnUrl });
          sessionStorage.setItem('bigboys_webpay_pending', JSON.stringify({ codigo: tx.codigo, token: tx.token }));
          redirectToWebpay(tx.url, tx.token);
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/90 backdrop-blur-md animate-fade-in overflow-y-auto">

            </div>
            {error && <div className="p-3 bg-red-950/50 border border-red-500/50 rounded-xl text-red-300 text-xs">⚠️ {error}</div>}

    // Lee el retorno de Webpay en la URL: token_ws (pago terminado) o TBK_TOKEN (pago anulado)
    function readWebpayReturn() {
      try {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token_ws');
        const tbk = params.get('TBK_TOKEN');
        if (token) return { token, aborted: false };
        if (tbk) return { token: tbk, aborted: true };
        if (params.get('TBK_ORDEN_COMPRA')) return { token: null, aborted: true, timeout: true };
      } catch (e) {}
      return null;
    }

    function WebpayReturnModal({ webpayReturn, onClose }) {
      const [result, setResult] = useState(null);
      const [error, setError] = useState('');

      useEffect(() => {
        window.history.replaceState({}, '', window.location.pathname);
        const pending = JSON.parse(sessionStorage.getItem('bigboys_webpay_pending') || 'null');
        const token = webpayReturn.token || (pending && pending.token);
        if (!token) { setError('El pago no se completó a tiempo. La reserva no quedó confirmada.'); return; }
        callApi('api_webpay_confirmar', { p_token: token, p_abortado: webpayReturn.aborted })
          .then(r => {
            setResult(r);
            sessionStorage.removeItem('bigboys_webpay_pending');
            store.refreshAppointmentsFromCloud();
            if (r.aprobado) store.addNotification('Reserva confirmada', `Tu abono fue aprobado. Código de reserva ${r.codigo}.`);
          })
          .catch(err => setError(err.message));
      }, []);

      const ok = result && result.aprobado && !result.sin_cupo;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/90 backdrop-blur-md animate-fade-in overflow-y-auto">
          <div className="bg-[#121212] border border-zinc-700 rounded-3xl w-full max-w-md p-5 sm:p-6 shadow-2xl my-6 space-y-4 text-center">
            {!result && !error && (
              <div className="py-10 space-y-3">
                <div className="w-12 h-12 border-4 border-[#FFD700] border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p className="text-xs text-zinc-300">Confirmando el pago con Transbank…</p>
              </div>
            )}
            {error && (
              <>
                <div className="text-3xl">⚠️</div>
                <p className="text-sm text-red-300">{error}</p>
              </>
            )}
            {result && (
              <>
                <div className={`w-14 h-14 rounded-full border-2 flex items-center justify-center text-2xl mx-auto ${ok ? 'bg-green-500/20 border-green-500 text-green-400' : 'bg-red-500/20 border-red-500 text-red-400'}`}>{ok ? '✓' : '✕'}</div>
                <div>
                  <span className={`text-[10px] font-black uppercase tracking-widest block ${ok ? 'text-green-400' : 'text-red-400'}`}>
                    {ok ? 'TRANSACCIÓN APROBADA' : result.sin_cupo ? 'PAGO APROBADO SIN HORARIO DISPONIBLE' : result.estado === 'ANULADO' ? 'PAGO ANULADO' : 'TRANSACCIÓN RECHAZADA'}
                  </span>
                  <h3 className="text-lg font-black text-white font-brand">{ok ? 'RESERVA CONFIRMADA' : 'LA RESERVA NO SE CONFIRMÓ'}</h3>
                </div>
                {ok ? (
                  <div className="bg-[#1E1E1E] border border-zinc-800 rounded-2xl p-4 text-xs space-y-2 text-left">
                    <div className="flex justify-between"><span className="text-zinc-400">Código de reserva:</span><strong className="text-[#FFD700] font-mono">{result.codigo}</strong></div>
                    <div className="flex justify-between"><span className="text-zinc-400">Orden de compra:</span><strong className="text-zinc-200 font-mono">{result.orden_compra}</strong></div>
                    <div className="flex justify-between"><span className="text-zinc-400">Cód. autorización:</span><strong className="text-zinc-200 font-mono">{result.autorizacion}</strong></div>
                    <div className="flex justify-between"><span className="text-zinc-400">Medio de pago:</span><strong className="text-zinc-200">{({ DEBITO: 'Débito', CREDITO: 'Crédito', PREPAGO: 'Prepago' })[result.tipo_medio] || 'Tarjeta'}{result.tarjeta ? ` ···· ${result.tarjeta}` : ''}</strong></div>
                    <div className="flex justify-between"><span className="text-zinc-400">Fecha:</span><strong className="text-zinc-200">{result.fecha}</strong></div>
                    <div className="flex justify-between pt-2 border-t border-zinc-800"><span className="text-zinc-400 font-bold">Abono pagado:</span><strong className="text-base text-green-400 font-black">{AppFormatters.formatClp(result.monto)}</strong></div>
                  </div>
                ) : (
                  <p className="text-xs text-zinc-400">
                    {result.sin_cupo
                      ? 'Tu pago se aprobó, pero el horario ya no estaba disponible. Te devolveremos el abono; contáctanos con el código ' + result.codigo + '.'
                      : 'No se realizó ningún cargo. El horario quedó libre y puedes intentar nuevamente.'}
                  </p>
                )}
              </>
            )}
            <div className="flex space-x-2">
              {ok && <button onClick={() => window.print()} className="flex-1 py-2.5 bg-zinc-800 text-zinc-300 text-xs font-bold rounded-xl">🖨️ Imprimir</button>}
              <button onClick={onClose} disabled={!result && !error} className="flex-1 py-2.5 bg-[#FFD700] text-black font-black text-xs uppercase rounded-xl">{ok ? 'Ver mis citas →' : 'Volver'}</button>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Fila por orden de llegada ----------
    function useQueue(locationId, intervalMs = 8000) {
      const [queue, setQueue] = useState(null);
      const [error, setError] = useState('');
      const reload = async () => {
        if (!locationId) return;
        try {
          setQueue(await callApi('api_fila_listar', { p_sucursal: Number(locationId) }));
          setError('');
        } catch (err) { setError(err.message); }
      };
      useEffect(() => {
        reload();
        const t = setInterval(reload, intervalMs);
        return () => clearInterval(t);
      }, [locationId]);
      return { queue, error, reload };
    }

    // Vista pública: cuántas personas esperan y a quién se está llamando (sin datos personales)

      const [locationId, setLocationId] = useState(() => (locations[0] && locations[0].id) || 1);
      const { queue, error } = useQueue(locationId);

      const called = turns.filter(t => t.estado === 'LLAMADO');

      return (
        <div className="space-y-4 pb-28">
          <div>
            <h2 className="text-2xl font-black italic text-white font-brand">FILA POR ORDEN DE LLEGADA</h2>
            <p className="text-xs text-zinc-400">Revisa cuánta gente hay antes de ir. Al llegar, el cajero/a te da tu número.</p>
          </div>
          <select value={locationId} onChange={e => setLocationId(Number(e.target.value))} className={inputCls}>
            {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
          </select>
          {error && <div className="p-3 bg-red-950/50 border border-red-500/50 rounded-xl text-red-300 text-xs">⚠️ {error}</div>}
          <div className="grid grid-cols-2 gap-3">
            <div className={cardCls + ' text-center'}>
              <span className="text-[10px] uppercase text-zinc-400 font-bold block">Personas esperando</span>
              <strong className="text-4xl font-black text-[#FFD700]">{queue ? queue.en_espera : '–'}</strong>
            </div>
            <div className={cardCls + ' text-center'}>
              <span className="text-[10px] uppercase text-zinc-400 font-bold block">Espera estimada</span>
              <strong className="text-4xl font-black text-white">{queue ? queue.espera_estimada_min : '–'}</strong>
              <span className="text-xs text-zinc-400"> min</span>
            </div>
          </div>
          <div className={cardCls}>
            <span className="text-[10px] uppercase text-zinc-400 font-bold">Llamando ahora</span>
            <div className="flex flex-wrap gap-2 mt-2">
              {called.length === 0 ? <span className="text-xs text-zinc-500">Nadie por ahora.</span> :
                called.map(t => <span key={t.id} className="px-3 py-2 rounded-xl bg-[#FFD700] text-black font-black text-lg">N° {t.numero}</span>)}
            </div>
          </div>
          <div className={cardCls}>
            <span className="text-[10px] uppercase text-zinc-400 font-bold">En espera</span>
            <div className="flex flex-wrap gap-2 mt-2">
              {waiting.length === 0 ? <span className="text-xs text-zinc-500">Sin fila: ¡ven ahora!</span> :
                waiting.map(t => <span key={t.id} className="px-3 py-1.5 rounded-lg bg-zinc-800 text-white font-bold text-xs">N° {t.numero}</span>)}
            </div>
          </div>
        </div>
      );

    // Gestión de la fila: registrar llegada, llamar, iniciar, terminar con monto y medio de pago, o marcar que se fue
    function QueueManager({ staff, locations, barbers, fixedLocationId }) {
      const [locationId, setLocationId] = useState(() => fixedLocationId || (locations[0] && locations[0].id) || 1);
      const { queue, error, reload } = useQueue(locationId, 6000);
      const [name, setName] = useState('');
      const [serviceName, setServiceName] = useState('Corte');
      const [barberId, setBarberId] = useState('');
      const [finishing, setFinishing] = useState(null);
      const [amount, setAmount] = useState('');
      const [tip, setTip] = useState('0');
      const [payMethod, setPayMethod] = useState('EFECTIVO');
      const [msg, setMsg] = useState('');
      const [services, setServices] = useState([]);
      const branchBarbers = barbers.filter(b => Number(b.locationId) === Number(locationId) && b.active !== false);

      useEffect(() => {
        callApi('api_servicios', { p_sucursal: Number(locationId) })
          .then(list => setServices((list || []).filter(s => s.bookable)))
          .catch(() => setServices([]));
      }, [locationId]);

      const run = async (fn) => {
        setMsg('');
        try { await fn(); await reload(); } catch (err) { setMsg('⚠️ ' + err.message); }
      };

      const register = (e) => {
        e.preventDefault();
        run(async () => {
          const r = await callApi('api_fila_registrar', { ...StaffSession.creds(staff), p: {
            location_id: Number(locationId), nombre: name, service_name: serviceName, barber_id: barberId ? Number(barberId) : null } });
          setMsg(`✓ ${name} quedó con el número ${r.numero}.`);
          setName('');
        });
      };
      const act = (turn, action, extra = {}) => run(() => callApi('api_fila_actualizar', {
        ...StaffSession.creds(staff), p_id_turno: turn.id, p_accion: action, p: extra }));

      const turns = (queue && queue.turnos) || [];
      const active = turns.filter(t => !['ATENDIDO', 'ABANDONO'].includes(t.estado));
      const done = turns.filter(t => ['ATENDIDO', 'ABANDONO'].includes(t.estado));

      return (
        <div className="space-y-4">
          {!fixedLocationId && (
            <select value={locationId} onChange={e => setLocationId(Number(e.target.value))} className={inputCls}>
              {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
          )}
          <form onSubmit={register} className={cardCls + ' space-y-2'}>
            <strong className="text-xs text-white uppercase">Registrar llegada</strong>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
              <input required value={name} onChange={e => setName(e.target.value)} placeholder="Nombre para llamarlo" className={inputCls} />
              <select value={serviceName} onChange={e => setServiceName(e.target.value)} className={inputCls}>
                {(services.length ? services : [{ id: 0, name: 'Corte' }]).map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
              </select>
              <select value={barberId} onChange={e => setBarberId(e.target.value)} className={inputCls}>
                <option value="">Cualquier barbero</option>
                {branchBarbers.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
              <button type="submit" className="py-2 bg-[#FFD700] text-black font-black text-xs uppercase rounded-xl">Dar número</button>
            </div>
          </form>
          {(msg || error) && <div className="p-2.5 rounded-xl bg-zinc-800 text-xs text-[#FFD700]">{msg || error}</div>}
          <div className="grid grid-cols-3 gap-2 text-center text-xs">
            <div className={cardCls}><span className="text-zinc-400 block">En espera</span><strong className="text-2xl text-[#FFD700]">{queue ? queue.en_espera : '–'}</strong></div>
            <div className={cardCls}><span className="text-zinc-400 block">Atendidos hoy</span><strong className="text-2xl text-emerald-400">{turns.filter(t => t.estado === 'ATENDIDO').length}</strong></div>
            <div className={cardCls}><span className="text-zinc-400 block">Se fueron</span><strong className="text-2xl text-red-400">{turns.filter(t => t.estado === 'ABANDONO').length}</strong></div>
          </div>
          <div className="space-y-2">
            {active.length === 0 && <p className="text-xs text-zinc-500 text-center py-4">No hay clientes en la fila.</p>}
            {active.map(t => (
              <div key={t.id} className={cardCls + ' flex flex-col sm:flex-row sm:items-center gap-2 justify-between'}>
                <div className="text-xs">
                  <strong className="text-lg text-white mr-2">N° {t.numero}</strong>
                  <span className="text-white font-bold">{t.nombre}</span>
                  <span className="text-zinc-400"> · {t.servicio || 'Corte'} · llegó {t.llegada}{t.barbero ? ` · ${t.barbero}` : ''}</span>
                  <span className={`ml-2 font-bold ${QUEUE_COLORS[t.estado]}`}>{QUEUE_LABELS[t.estado]}</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {t.estado === 'EN_ESPERA' && <button onClick={() => act(t, 'LLAMAR')} className="px-3 py-1.5 bg-zinc-800 text-[#FFD700] text-xs font-bold rounded-lg">📣 Llamar</button>}
                  {['EN_ESPERA', 'LLAMADO'].includes(t.estado) && (
                    <>
                      <button onClick={() => {
                        const chosen = t.barber_id || (branchBarbers[0] && branchBarbers[0].id);
                        act(t, 'INICIAR', { barber_id: chosen });
                      }} className="px-3 py-1.5 bg-cyan-700 text-white text-xs font-bold rounded-lg">✂️ Iniciar</button>
                      <button onClick={() => act(t, 'ABANDONO')} className="px-3 py-1.5 bg-zinc-800 text-red-400 text-xs font-bold rounded-lg">Se fue</button>
                    </>
                  )}
                  {t.estado === 'EN_ATENCION' && <button onClick={() => { setFinishing(t); setAmount(''); setTip('0'); setPayMethod('EFECTIVO'); }} className="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg">✓ Terminar y cobrar</button>}
                </div>
              </div>
            ))}
          </div>
          {done.length > 0 && (
            <details className={cardCls}>
              <summary className="text-xs text-zinc-400 cursor-pointer">Atendidos y retirados hoy ({done.length})</summary>
              <div className="mt-2 space-y-1">
                {done.map(t => <div key={t.id} className="text-xs text-zinc-400">N° {t.numero} · {t.nombre} · <span className={QUEUE_COLORS[t.estado]}>{QUEUE_LABELS[t.estado]}</span>{t.barbero ? ` · ${t.barbero}` : ''}</div>)}
              </div>
            </details>
          )}
          {finishing && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
              <form onSubmit={(e) => { e.preventDefault(); act(finishing, 'TERMINAR', { monto: amount ? Number(amount) : null, propina: Number(tip) || 0, medio_pago: payMethod }); setFinishing(null); }}
                className="bg-[#1E1E1E] border border-[#FFD700]/50 rounded-2xl w-full max-w-sm p-5 space-y-3">
                <h3 className="text-sm font-black text-white">Cobrar N° {finishing.numero} · {finishing.nombre}</h3>
                <input type="number" min="0" value={amount} onChange={e => setAmount(e.target.value)} placeholder="Monto cobrado (vacío = precio del servicio)" className={inputCls} />
                <input type="number" min="0" value={tip} onChange={e => setTip(e.target.value)} placeholder="Propina" className={inputCls} />
                <select value={payMethod} onChange={e => setPayMethod(e.target.value)} className={inputCls}>
                  <option value="EFECTIVO">Efectivo</option><option value="DEBITO">Débito</option>
                  <option value="CREDITO">Crédito</option><option value="TRANSFERENCIA">Transferencia</option>
                </select>
                <div className="flex gap-2">
                  <button type="button" onClick={() => setFinishing(null)} className="flex-1 py-2 bg-zinc-800 text-zinc-300 text-xs font-bold rounded-xl">Cancelar</button>
                  <button type="submit" className="flex-1 py-2 bg-emerald-600 text-white text-xs font-black rounded-xl">Registrar</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

            ...form, location_id: Number(form.location_id), temp_password_sha256: await ValidationUtils.hashPassword(temp) } });

          reload();

      return (

                <option value="ADMIN_SUCURSAL">Cajero/a de sucursal</option>

              {form.role === 'BARBERO' && <input value={form.specialty} onChange={set('specialty')} placeholder="Especialidad (opcional)" className={inputCls} />}
            </div>
            <button type="submit" className="px-4 py-2 bg-[#FFD700] text-black font-black text-xs uppercase rounded-xl">Crear y generar clave temporal</button>
          </form>
          {tempShown && (
            <div className="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/50 text-xs text-emerald-200">

              <span className="block text-[11px] text-zinc-400 mt-1">Entrégala en persona. No se vuelve a mostrar y el colaborador debe cambiarla al ingresar.</span>
              <button onClick={() => setTempShown(null)} className="mt-2 px-3 py-1 bg-zinc-800 rounded-lg text-zinc-300">Ya la entregué</button>
            </div>
          )}
          {msg && <div className="p-2.5 rounded-xl bg-zinc-800 text-xs text-[#FFD700]">{msg}</div>}
          <div className="space-y-2">
            {list.map(p => (
              <div key={p.id} className={cardCls + ' flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs'}>
                <div>
                  <strong className="text-white">{p.public_name || p.full_name}</strong>
                  <span className="text-zinc-400"> · {p.email} · {ROLE_LABELS[p.role]} · {locName(p.location_id)}</span>
                  <span className={`ml-2 font-bold ${p.estado === 'ACTIVO' ? 'text-emerald-400' : 'text-red-400'}`}>{p.estado}</span>

                  <span className="block text-[10px] text-zinc-500">Último acceso: {p.ultimo_acceso || 'nunca'}</span>

                  ? <button onClick={() => toggle(p, false)} className="px-3 py-1.5 bg-zinc-800 text-red-400 font-bold rounded-lg">Bloquear acceso</button>

              </div>
            ))}
          </div>
        </div>
      );

                <span className="text-zinc-400">Ingreso {d.ingreso} · vence {d.fecha_limite} · <strong className="text-[#FFD700]">{d.estado}</strong></span>
              </div>
              {d.detalle && <p className="text-zinc-300">“{d.detalle}”</p>}
              {d.respuesta && <p className="text-emerald-300">Respuesta: {d.respuesta}</p>}
              {!['RESPONDIDA', 'RECHAZADA'].includes(d.estado) && (
                <div className="flex flex-col sm:flex-row gap-2">
                  <input value={answer[d.id] || ''} onChange={e => setAnswer({ ...answer, [d.id]: e.target.value })} placeholder="Respuesta al titular" className={inputCls} />
                  <button onClick={() => respond(d, 'RESPONDIDA')} className="px-3 py-1.5 bg-emerald-600 text-white font-bold rounded-lg">Responder</button>
                  <button onClick={() => respond(d, 'PRORROGADA')} className="px-3 py-1.5 bg-zinc-800 text-amber-300 font-bold rounded-lg">Prorrogar</button>
                  <button onClick={() => respond(d, 'RECHAZADA')} className="px-3 py-1.5 bg-zinc-800 text-red-400 font-bold rounded-lg">Rechazar</button>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    // ---------- Panel del cajero/a: fila de su sucursal y reservas del día ----------

      const [tab, setTab] = useState('fila');

      const todays = appointments.filter(a => Number(a.locationId) === Number(locationId) && (a.dateTime || '').startsWith(today));
      return (
        <div className="space-y-4 pb-10">
          <div className="flex flex-wrap justify-between items-center gap-2">
            <div>
              <span className="text-[10px] font-black uppercase text-cyan-400 tracking-widest">Cajero/a · {loc ? loc.name : 'Sucursal'}</span>
              <h2 className="text-xl font-black text-white font-brand">Hola, {staff.name}</h2>
            </div>
            <button onClick={onLogout} className="px-3 py-2 bg-zinc-800 text-zinc-300 text-xs font-bold rounded-xl">Cerrar sesión</button>
          </div>
          <div className="flex gap-2">
            {[['fila', '🎟️ Fila por llegada'], ['reservas', `📅 Reservas de hoy (${todays.length})`]].map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)} className={`px-4 py-2 rounded-2xl text-xs font-bold ${tab === id ? 'bg-[#FFD700] text-black' : 'bg-[#1E1E1E] text-zinc-400 border border-zinc-800'}`}>{label}</button>
            ))}
          </div>
          {tab === 'fila' && <QueueManager staff={staff} locations={locations} barbers={barbers} fixedLocationId={locationId} />}
          {tab === 'reservas' && (
            <div className="space-y-2">
              {todays.length === 0 && <p className="text-xs text-zinc-500 text-center py-4">No hay reservas para hoy en esta sucursal.</p>}
              {todays.sort((a, b) => a.dateTime.localeCompare(b.dateTime)).map(a => {
                const b = barbers.find(x => Number(x.id) === Number(a.barberId));
                return (
                  <div key={a.id} className={cardCls + ' flex flex-wrap justify-between gap-2 text-xs'}>
                    <span><strong className="text-white">{a.dateTime.slice(11, 16)}</strong> · {a.customerName} · {a.serviceName} · {b ? b.name : ''}</span>
                    <span className="flex items-center gap-2">
                      <span className="text-[#FFD700] font-bold">{a.status}</span>
                      {a.status === 'Confirmada' && (
                        <>
                          <button onClick={() => store.updateAppointmentStatusAdmin(a.id, 'Completada')} className="px-2 py-1 bg-emerald-700 text-white rounded-lg">Atendida</button>
                          <button onClick={() => store.updateAppointmentStatusAdmin(a.id, 'No-Show (Inasistencia)')} className="px-2 py-1 bg-zinc-800 text-red-400 rounded-lg">No llegó</button>
                        </>
                      )}
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ---------- Panel del barbero: solo sus atenciones y lo ganado (CU-41) ----------
    function BarberEarningsDashboard({ staff, onLogout }) {

              <h2 className="text-xl font-black text-white font-brand">{staff.name}</h2>
            </div>
            <button onClick={onLogout} className="px-3 py-2 bg-zinc-800 text-zinc-300 text-xs font-bold rounded-xl">Cerrar sesión</button>

            <div className={cardCls}><span className="text-[10px] text-zinc-400 block">Atenciones</span><strong className="text-2xl text-white">{data ? data.atenciones.length : '–'}</strong></div>
            <div className={cardCls}><span className="text-[10px] text-zinc-400 block">Total cobrado</span><strong className="text-lg text-[#FFD700]">{data ? AppFormatters.formatClp(data.total, false) : '–'}</strong></div>
            <div className={cardCls}><span className="text-[10px] text-zinc-400 block">Propinas</span><strong className="text-lg text-emerald-400">{data ? AppFormatters.formatClp(data.propinas, false) : '–'}</strong></div>
          </div>

            {data && data.atenciones.length === 0 && <p className="text-xs text-zinc-500 text-center py-4">Sin atenciones registradas este día.</p>}

              <div key={i} className={cardCls + ' flex justify-between text-xs'}>

                <span className="text-[#FFD700] font-bold">{AppFormatters.formatClp(a.monto, false)}{Number(a.propina) > 0 ? ` + ${AppFormatters.formatClp(a.propina, false)}` : ''}</span>

          <p className="text-[10px] text-zinc-500 text-center">Por privacidad, aquí no se muestran datos de contacto de los clientes.</p>
        </div>
      );
    }

    // ---------- «Mis datos»: derechos del titular (Ley N° 21.719) ----------
    function MyDataPanel({ user }) {
      const [msg, setMsg] = useState('');
      const [data, setData] = useState(null);
      const [requestType, setRequestType] = useState('RECTIFICACION');
      const [detail, setDetail] = useState('');
      const [promo, setPromo] = useState(null);
      const creds = { p_email: user.email, p_password_sha256: user.passwordHash };

      const view = async (tipo) => {
        setMsg('');
        try {
          const d = await callApi('api_mis_datos', { ...creds, p_tipo: tipo });
          setData(d);
          const active = (d.consentimientos || []).find(k => k.finalidad === 'PROMOCIONAL' && !k.revocado_en);
          setPromo(Boolean(active));
          if (tipo === 'PORTABILIDAD') {
            const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `mis_datos_bigboys_${d.generado_en.slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            setMsg('✓ Descargaste tus datos en formato JSON (portabilidad).');
          }
        } catch (err) { setMsg('⚠️ ' + err.message); }
      };
      const sendRequest = async (e) => {
        e.preventDefault();
        setMsg('');
        try {
          const r = await callApi('api_solicitud_derecho', { ...creds, p_tipo: requestType, p_detalle: detail });
          setMsg(`✓ Solicitud ${r.codigo} recibida. Te responderemos a más tardar el ${r.fecha_limite}.`);
          setDetail('');
          if (data) view('ACCESO');
        } catch (err) { setMsg('⚠️ ' + err.message); }
      };
      const togglePromo = async () => {
        try {
          const r = await callApi('api_consentimiento', { ...creds, p_otorgado: !promo, p_canal: 'WEB' });
          setPromo(r.promocional);
          setMsg(r.promocional ? '✓ Aceptaste recibir promociones.' : '✓ Ya no recibirás promociones.');
        } catch (err) { setMsg('⚠️ ' + err.message); }
      };

      return (
        <div className="mt-5 pt-4 border-t border-zinc-800 space-y-3">
          <h4 className="text-xs font-black text-[#FFD700] uppercase">Mis datos · Ley N° 21.719</h4>
          {msg && <div className="p-2 rounded bg-zinc-800 text-xs text-[#FFD700]">{msg}</div>}
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={() => view('ACCESO')} className="py-2 bg-zinc-800 text-white text-xs font-bold rounded-xl">👁️ Ver mis datos</button>
            <button type="button" onClick={() => view('PORTABILIDAD')} className="py-2 bg-zinc-800 text-white text-xs font-bold rounded-xl">⬇️ Descargar (JSON)</button>
          </div>
          {data && (
            <div className="max-h-40 overflow-y-auto p-2 rounded-xl bg-[#121212] border border-zinc-800 text-[11px] text-zinc-300 space-y-1">
              <div>Nombre: <strong>{data.cuenta.nombre} {data.cuenta.apellido || ''}</strong> · {data.cuenta.email} · {data.cuenta.telefono || 'sin teléfono'}</div>
              <div>Reservas: {data.reservas.length} · Pagos: {data.pagos.length} · Atenciones: {data.atenciones.length} · Reseñas: {data.resenas.length}</div>
              <div>Consentimientos: {data.consentimientos.map(k => `${k.finalidad}${k.revocado_en ? ' (revocado)' : ''}`).join(', ') || 'ninguno'}</div>
              <div>Solicitudes: {data.solicitudes.map(s => `${s.codigo} ${s.tipo} ${s.estado}`).join(' · ') || 'ninguna'}</div>
            </div>
          )}
          {promo !== null && (
            <label className="flex items-center justify-between text-xs text-zinc-300">
              <span>Recibir promociones por correo</span>
              <input type="checkbox" checked={promo} onChange={togglePromo} className="accent-[#FFD700] w-4 h-4" />
            </label>
          )}
          <form onSubmit={sendRequest} className="space-y-2">
            <select value={requestType} onChange={e => setRequestType(e.target.value)} className={inputCls}>
              <option value="RECTIFICACION">Rectificar un dato incorrecto</option>
              <option value="OPOSICION">Oponerme a un tratamiento</option>
              <option value="BLOQUEO">Bloquear temporalmente mis datos</option>
            </select>
            <textarea required value={detail} onChange={e => setDetail(e.target.value)} placeholder="Cuéntanos qué necesitas" rows={2} className={inputCls} />
            <button type="submit" className="w-full py-2 bg-zinc-800 text-[#FFD700] text-xs font-bold rounded-xl">Enviar solicitud</button>
          </form>
          <button type="button" onClick={async () => {
            if (!window.confirm('¿Eliminar tu cuenta? Tus datos personales se anonimizan y no se puede deshacer.')) return;
            await store.deleteUser(user.email);
            window.location.reload();
          }} className="w-full py-2 bg-red-950/50 border border-red-500/40 text-red-300 text-xs font-bold rounded-xl">🗑️ Eliminar mi cuenta (supresión)</button>
        </div>
      );
    }

    // ==========================================
    // 5. COMPONENTE RAÍZ APP
    // ==========================================
    function App() {
      const [storeState, setStoreState] = useState({
        locations: store.getLocations(),
        barbers: store.getBarbers(),
        appointments: store.getAppointments(),
        reviews: store.getReviews(),
        coupons: store.getCoupons(),
        users: store.getUsers(),
        notifications: store.getNotifications(),
        emailDatabase: store.getEmailDatabase(),
        sentEmailsLog: store.getSentEmailsLog(),
        user: store.getLoggedInUser(),
        barber: store.getLoggedInBarber(),
        isAdmin: store.isAdmin(),
        isDarkMode: store.isDarkMode(),
        adminConfig: store.getAdminConfig(),
        gmailConfig: store.getGmailConfig(),
        userCoupon: store.getUserCoupon()
      });

      // Control de sesión: La aplicación comienza obligatoriamente en la pantalla de Login
      const [sessionUnlocked, setSessionUnlocked] = useState(() => Boolean(readWebpayReturn()) || Boolean(StaffSession.get()));
      const [staff, setStaff] = useState(() => StaffSession.get());
      const [webpayReturn, setWebpayReturn] = useState(() => readWebpayReturn());
      const [showSplash, setShowSplash] = useState(false);

      const [previewAsClient, setPreviewAsClient] = useState(false);

      const [activeTab, setActiveTab] = useState(() => {
        return store.isAdmin() ? 'admin' : 'inicio';
      });

      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authModalMode, setAuthModalMode] = useState('login');

      const [bookingWizardOpen, setBookingWizardOpen] = useState(false);
      const [preselectedBarber, setPreselectedBarber] = useState(null);
      const [preselectedLocation, setPreselectedLocation] = useState(null);

      const [webpayModalOpen, setWebpayModalOpen] = useState(false);
      const [currentBookingDraft, setCurrentBookingDraft] = useState(null);

      const [profileModalOpen, setProfileModalOpen] = useState(false);
      const [notificationsModalOpen, setNotificationsModalOpen] = useState(false);

      useEffect(() => {
        if (storeState.isAdmin && !previewAsClient) {
          setActiveTab('admin');
        }
      }, [storeState.isAdmin]);

      useEffect(() => {
        const unsubscribe = store.subscribe(() => {
          setStoreState({
            locations: store.getLocations(),
            barbers: store.getBarbers(),
            appointments: store.getAppointments(),
            reviews: store.getReviews(),
            coupons: store.getCoupons(),
            users: store.getUsers(),
            notifications: store.getNotifications(),
            emailDatabase: store.getEmailDatabase(),
            sentEmailsLog: store.getSentEmailsLog(),
            user: store.getLoggedInUser(),
            barber: store.getLoggedInBarber(),
            isAdmin: store.isAdmin(),
            isDarkMode: store.isDarkMode(),
            adminConfig: store.getAdminConfig(),
            gmailConfig: store.getGmailConfig(),
            userCoupon: store.getUserCoupon()
          });
        });

        return unsubscribe;
      }, []);

      useEffect(() => {
        const isDark = storeState.isDarkMode;
        if (typeof document !== 'undefined') {
          document.body.classList.toggle('light-mode', !isDark);
          document.documentElement.classList.toggle('light-mode', !isDark);
          document.documentElement.classList.toggle('dark', isDark);
        }
      }, [storeState.isDarkMode]);

      const handleOpenBooking = () => {
        setPreselectedBarber(null);
        setPreselectedLocation(null);
        setBookingWizardOpen(true);
      };

      const handleBookWithBarber = (barber) => {
        setPreselectedBarber(barber);
        setPreselectedLocation(null);
        setBookingWizardOpen(true);
      };

      const handleSelectBranchForBooking = (location) => {
        setPreselectedLocation(location);
        setPreselectedBarber(null);
        setBookingWizardOpen(true);
      };

      const handleProceedToPayment = (draft) => {
        setCurrentBookingDraft(draft);
        setBookingWizardOpen(false);
        setWebpayModalOpen(true);
      };

      const handleLogout = () => {
        store.logout();
        store.logoutBarber();
        StaffSession.clear();
        setStaff(null);
        localStorage.setItem('bigboys_is_admin', 'false');
        if (typeof sessionStorage !== 'undefined') {
          sessionStorage.removeItem('bigboys_session_active');
          sessionStorage.removeItem('bigboys_splash_shown');
        }
        setSessionUnlocked(false);
        setPreviewAsClient(false);
        setActiveTab('inicio');
      };

      if (showSplash) {
        return (
          <SplashScreen
            onFinish={() => {
              sessionStorage.setItem('bigboys_splash_shown', 'true');
              setShowSplash(false);
            }}
          />
        );
      }

      // PUERTA DE ACCESO OBLIGATORIA: Siempre pasa por el login al entrar a la página
      if (!sessionUnlocked) {
        return (
          <LoginPortalScreen
            onLoginSuccess={(loggedUser) => {
              if (typeof sessionStorage !== 'undefined') {
                sessionStorage.setItem('bigboys_session_active', 'true');
              }
              setSessionUnlocked(true);
              setActiveTab('inicio');
            }}
            onBarberSuccess={(session) => {
              if (typeof sessionStorage !== 'undefined') {
                sessionStorage.setItem('bigboys_session_active', 'true');
              }
              setStaff(session);
              setSessionUnlocked(true);
            }}
            onAdminSuccess={(session) => {
              if (typeof sessionStorage !== 'undefined') {
                sessionStorage.setItem('bigboys_session_active', 'true');
              }
              setStaff(session);
              if (session.role === 'DUENO') {
                // El Dueño entra al panel de administración completo
                localStorage.setItem('bigboys_is_admin', 'true');
                localStorage.setItem('bigboys_logged_user', JSON.stringify({ id: session.id, fullName: session.name, email: session.email, phone: '' }));
                store.notify();
                setActiveTab('admin');
              }
              setSessionUnlocked(true);
              setPreviewAsClient(false);
            }}
            onRegisterSuccess={(newUser) => {
              if (typeof sessionStorage !== 'undefined') {
                sessionStorage.setItem('bigboys_session_active', 'true');
              }
              setSessionUnlocked(true);
              setActiveTab('inicio');
            }}
            onGuestContinue={() => {
              if (typeof sessionStorage !== 'undefined') {
                sessionStorage.setItem('bigboys_session_active', 'true');
              }
              store.logout();
              setSessionUnlocked(true);
              setActiveTab('inicio');
            }}
            barbers={storeState.barbers}
            locations={storeState.locations}
            isDarkMode={storeState.isDarkMode}
            onToggleTheme={() => store.toggleDarkMode()}
          />
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-[#121212] transition-colors">
          <Navbar
            user={storeState.user}
            barber={storeState.barber}
            isAdmin={storeState.isAdmin}
            previewAsClient={previewAsClient}
            onTogglePreviewClient={() => {
              const next = !previewAsClient;
              setPreviewAsClient(next);
              setActiveTab(next ? 'inicio' : 'admin');
            }}
            isDarkMode={storeState.isDarkMode}
            notificationsCount={storeState.notifications.length}
            onToggleTheme={() => store.toggleDarkMode()}
            onOpenNotifications={() => setNotificationsModalOpen(true)}
            onOpenProfile={() => setProfileModalOpen(true)}
            onOpenAuth={() => { setAuthModalMode('login'); setAuthModalOpen(true); }}
            onLogout={handleLogout}
          />

          {/* Banner de previsualización para el Administrador si activa "Vista Cliente" */}
          {storeState.isAdmin && previewAsClient && (
            <div className="bg-gradient-to-r from-amber-950 via-zinc-900 to-amber-950 border-b border-[#FFD700]/50 py-2.5 px-4 text-center text-xs flex flex-wrap items-center justify-center gap-2 shadow-lg sticky top-16 z-30 animate-fade-in">
              <span className="text-[#FFD700] font-black tracking-wide">
                🛡️ VISTA PREVIA CLIENTE: Estás explorando cómo los clientes ven la web pública.
              </span>
              <button
                onClick={() => { setPreviewAsClient(false); setActiveTab('admin'); }}
                className="px-3 py-1 bg-[#FFD700] hover:bg-[#E5C100] text-black font-black text-[11px] uppercase rounded-lg shadow transition-all"
              >
                Volver al Panel de Administración &rarr;
              </button>
            </div>
          )}

          {/* Navegación inferior y botón flotante: SOLO si NO es admin ni barbero o si está en Vista Previa Cliente */}
          {(!storeState.isAdmin && !storeState.barber && !(staff && staff.role !== 'DUENO') || previewAsClient) && (
            <BottomNav
              activeTab={activeTab}
              onTabChange={(tab) => { setActiveTab(tab); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              hasUser={!!storeState.user}
              isAdmin={storeState.isAdmin}
              onOpenBooking={handleOpenBooking}
            />
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            {/* Personal con cuenta: barbero (sus atenciones) y cajero/a (fila y reservas de su sucursal) */}
            {staff && staff.role === 'BARBERO' ? (
              <BarberEarningsDashboard staff={staff} onLogout={handleLogout} />
            ) : staff && staff.role === 'ADMIN_SUCURSAL' ? (
              <CashierDashboard staff={staff} locations={storeState.locations} barbers={storeState.barbers}
                appointments={storeState.appointments} onLogout={handleLogout} />
            ) : storeState.barber ? (
              <BarberDashboard
                barber={storeState.barber}
                locations={storeState.locations}
                barbers={storeState.barbers}
                appointments={storeState.appointments}
                onLogout={handleLogout}
              />
            ) : storeState.isAdmin && !previewAsClient ? (
              <AdminDashboard
                locations={storeState.locations}
                barbers={storeState.barbers}
                appointments={storeState.appointments}
                reviews={storeState.reviews}
                coupons={storeState.coupons}
                users={storeState.users}
                emailDatabase={storeState.emailDatabase}
                sentEmailsLog={storeState.sentEmailsLog}
                adminConfig={storeState.adminConfig}
                gmailConfig={storeState.gmailConfig}
                onLogout={handleLogout}
              />
            ) : (
              <>
                {activeTab === 'inicio' && (
                  <HomeScreen
                    user={storeState.user}
                    coupon={storeState.userCoupon}
                    appointments={storeState.appointments}
                    locations={storeState.locations}
                    onOpenBooking={handleOpenBooking}
                    onOpenRegister={() => { setAuthModalMode('register'); setAuthModalOpen(true); }}
                    onNavigateToTab={(tab) => setActiveTab(tab)}
                  />
                )}

                {activeTab === 'barberos' && (
                  <BarbersScreen
                    barbers={storeState.barbers}
                    locations={storeState.locations}
                    onBookWithBarber={handleBookWithBarber}
                  />
                )}

                {activeTab === 'sucursales' && (
                  <BranchesMapScreen
                    locations={storeState.locations}
                    barbers={storeState.barbers}
                    onSelectBranchForBooking={handleSelectBranchForBooking}
                    isDarkMode={storeState.isDarkMode}
                  />
                )}

                {activeTab === 'fila' && (
                  <QueueBoardScreen locations={storeState.locations} />
                )}

                {activeTab === 'resenas' && (
                  <ReviewsScreen
                    reviews={storeState.reviews}
                    locations={storeState.locations}
                    barbers={storeState.barbers}
                    onNavigateToBooking={handleOpenBooking}
                  />
                )}

                {activeTab === 'historial' && (
                  <HistoryScreen
                    user={storeState.user}
                    appointments={storeState.appointments}
                    locations={storeState.locations}
                    barbers={storeState.barbers}
                    onOpenProfile={() => setProfileModalOpen(true)}
                    onOpenBooking={handleOpenBooking}
                  />
                )}

                {activeTab === 'admin' && storeState.isAdmin && (
                  <AdminDashboard
                    locations={storeState.locations}
                    barbers={storeState.barbers}
                    appointments={storeState.appointments}
                    reviews={storeState.reviews}
                    coupons={storeState.coupons}
                    users={storeState.users}
                    emailDatabase={storeState.emailDatabase}
                    sentEmailsLog={storeState.sentEmailsLog}
                    adminConfig={storeState.adminConfig}
                    gmailConfig={storeState.gmailConfig}
                    onLogout={() => { store.logout(); setPreviewAsClient(false); setActiveTab('inicio'); }}
                  />
                )}
              </>
            )}
          </main>

          {authModalOpen && (
            <AuthModal
              isOpen={authModalOpen}
              initialMode={authModalMode}
              onClose={() => setAuthModalOpen(false)}
              onGuestContinue={() => { setAuthModalOpen(false); handleOpenBooking(); }}
            />
          )}

          {bookingWizardOpen && (
            <BookingWizard
              isOpen={bookingWizardOpen}
              onClose={() => setBookingWizardOpen(false)}
              locations={storeState.locations}
              barbers={storeState.barbers}
              appointments={storeState.appointments}
              user={storeState.user}
              preselectedBarber={preselectedBarber}
              preselectedLocation={preselectedLocation}
              onProceedToPayment={handleProceedToPayment}
            />
          )}

          {webpayModalOpen && (
            <WebpayModal
              isOpen={webpayModalOpen}
              bookingDraft={currentBookingDraft}
              onCancel={() => setWebpayModalOpen(false)}
            />
          )}

          {webpayReturn && (
            <WebpayReturnModal
              webpayReturn={webpayReturn}
              onClose={() => { setWebpayReturn(null); setActiveTab(storeState.user ? 'historial' : 'inicio'); }}
            />
          )}

          {profileModalOpen && (
            <ProfileModal
              isOpen={profileModalOpen}
              onClose={() => setProfileModalOpen(false)}
              user={storeState.user}
            />
          )}

          {notificationsModalOpen && (
            <NotificationsModal
              isOpen={notificationsModalOpen}
              onClose={() => setNotificationsModalOpen(false)}
              notifications={storeState.notifications}
            />
          )}
        </div>
      );
    }

    // Error Boundary para proteger la aplicación de cualquier excepción
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary capturó un error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#121212] flex flex-col items-center justify-center p-6 text-center text-white">
              <div className="p-6 bg-[#1E1E1E] border border-[#FFD700] rounded-3xl max-w-md w-full shadow-2xl">
                <span className="text-4xl block mb-3">⚠️</span>
                <h2 className="text-xl font-black text-[#FFD700] mb-2 font-brand">HUBO UN DETALLE AL ABRIR LA VENTANA</h2>
                <p className="text-xs text-zinc-300 mb-4">{this.state.error?.message || 'Error inesperado.'}</p>
                <button
                  onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                  className="px-5 py-2.5 bg-[#FFD700] text-black font-black text-xs uppercase rounded-xl"
                >
                  Recargar Aplicación
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Renderizar la aplicación en el DOM protegida por el ErrorBoundary
    const rootEl = document.getElementById('root');
    if (rootEl) {
      const root = ReactDOM.createRoot(rootEl);
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    }
  </script>
</body>
</html>
